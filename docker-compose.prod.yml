services:
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: test_admin
      POSTGRES_PASSWORD: test_1234
      POSTGRES_DB: test_lab4_1
    ports:
      - "5433:5432"  # Изменяем внешний порт на 5433 вместо 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_admin -d test_lab4_1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432  # Внутри контейнера порт остается 5432
      DB_USER: test_admin
      DB_PASSWORD: test_1234
      DB_NAME: test_lab4_1
      DB_DIALECT: postgres
      PORT: 3000
      FORCE_DB_SYNC: "false"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "start"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3