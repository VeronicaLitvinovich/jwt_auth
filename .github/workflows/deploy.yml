name: Deploy to Self-Hosted Runner

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install dependencies
        run: npm install

      - name: Run tests with SQLite
        run: |
          export DB_DIALECT=sqlite
          export DB_STORAGE=./test.sqlite
          npm test

  deploy:
    needs: test
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install dependencies
        run: npm install

      - name: Start application with SQLite
        run: |
          export DB_DIALECT=sqlite
          export DB_STORAGE=./database.sqlite
          npm start &
          sleep 10

      - name: Test application
        run: |
          timeout 30s bash -c 'until curl -f http://localhost:8080/health; do sleep 2; done'
          echo "✅ Application is ready!"
          curl http://localhost:8080/health
          curl http://localhost:8080/

      - name: Keep running
        run: |
          echo "🚀 Self-Hosted Runner with SQLite"
          sleep 300
