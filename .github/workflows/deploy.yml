name: Deploy to GitHub Runner

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_ENV: production
  DB_HOST: localhost
  DB_USER: test_admin
  DB_PASSWORD: test_1234
  DB_NAME: test_lab4db
  JWT_SECRET: production-jwt-secret-key-123
  CLIENT_URL: http://localhost:3000
  PORT: 8080

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: test_admin
          POSTGRES_PASSWORD: test_1234
          POSTGRES_DB: test_lab4db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Wait for PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          timeout 60s bash -c 'until pg_isready -h localhost -p 5432; do sleep 2; done'

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Run all tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: test_admin
          POSTGRES_PASSWORD: test_1234
          POSTGRES_DB: test_lab4db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Wait for PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          timeout 60s bash -c 'until pg_isready -h localhost -p 5432; do sleep 2; done'

      - name: Start application
        run: |
          npm start &
          echo "Application starting in background..."
          sleep 10

      - name: Wait for application to be ready
        run: |
          timeout 60s bash -c 'until curl -f http://localhost:8080/health; do sleep 2; done'
          echo "✅ Application is ready!"

      - name: Test API endpoints
        run: |
          # Test health endpoint
          curl -f http://localhost:8080/health
          echo "Health check passed"

          # Test main endpoint
          curl -f http://localhost:8080/
          echo "Main endpoint passed"

          # Test user registration
          curl -X POST http://localhost:8080/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"username":"githubuser","email":"github@example.com","password":"password123"}' || echo "Registration completed"

          # Test user login
          curl -X POST http://localhost:8080/api/auth/signin \
            -H "Content-Type: application/json" \
            -d '{"username":"githubuser","password":"password123"}' || echo "Login test completed"

      - name: Keep application running for demonstration
        run: |
          echo "🚀 Application is running on GitHub Runner"
          echo "📍 Health check: http://localhost:8080/health"
          echo "📍 Main endpoint: http://localhost:8080/"
          echo "⏰ Keeping application alive for 5 minutes for demonstration..."
          sleep 300

      - name: Upload deployment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-logs
          path: |
            *.log
          retention-days: 1
