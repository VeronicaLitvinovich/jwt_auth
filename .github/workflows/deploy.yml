name: Full CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_commit:
        description: "Commit hash to rollback to"
        required: false
        type: string
        default: "main"

env:
  NODE_ENV: test
  DB_DIALECT: sqlite

jobs:
  # Этап 1: Сборка и юнит-тесты
  build-and-unit-tests:
    runs-on: self-hosted
    name: Build and Unit Tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --production --audit-level=high

      - name: Run unit tests with coverage
        run: |
          npm run test:unit
        env:
          NODE_ENV: test

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage/
          retention-days: 7

  # Этап 2: Деплой на staging и интеграционные тесты
  deploy-staging-and-integration-tests:
    runs-on: self-hosted
    needs: build-and-unit-tests
    environment: staging
    name: Deploy to Staging & Integration Tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install dependencies
        run: npm ci

      - name: Download unit test coverage
        uses: actions/download-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage/

      - name: Deploy to staging environment
        run: |
          export PORT=3001
          export NODE_ENV=staging
          export DB_STORAGE=./staging.sqlite
          npm start &
          echo "🚀 Staging deployment started on port 3001"
          sleep 15

      - name: Wait for staging to be ready
        run: |
          echo "Waiting for staging application..."
          counter=1
          while [ $counter -le 10 ]; do
            if curl -f http://localhost:3001/health > /dev/null 2>&1; then
              echo "✅ Staging application is ready!"
              break
            fi
            echo "Attempt $counter/10 - Staging not ready yet..."
            counter=$((counter + 1))
            sleep 3
          done

          if [ $counter -gt 10 ]; then
            echo "❌ Staging failed to start"
            exit 1
          fi

      - name: Run integration tests against staging
        run: |
          export TEST_BASE_URL=http://localhost:3001
          npm run test:integration
        env:
          NODE_ENV: test

      - name: API smoke tests
        run: |
          echo "Running API smoke tests on staging..."

          # Health check
          curl -f http://localhost:3001/health
          echo "✅ Health check passed"

          # Main endpoint
          curl -f http://localhost:3001/
          echo "✅ Main endpoint passed"

          # Test authentication endpoints
          curl -X POST http://localhost:3001/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"username":"staginguser","email":"staging@example.com","password":"password123"}' \
            -w "\nHTTP Status: %{http_code}\n" || echo "User creation test completed"

          echo "✅ Staging environment verified"

      - name: Upload staging test results
        uses: actions/upload-artifact@v4
        with:
          name: staging-test-results
          path: |
            test-results/
            coverage/
          retention-days: 7

  # Этап 3: Деплой в production с PM2
  deploy-production:
    runs-on: self-hosted
    needs: deploy-staging-and-integration-tests
    environment: production
    name: Deploy to Production
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install dependencies
        run: npm ci

      - name: Install PM2 globally
        run: npm install -g pm2

      - name: Add start:production script to package.json
        run: |
          # Используем npm pkg set для добавления скрипта
          npm pkg set scripts.start:production="NODE_ENV=production PORT=3000 DB_STORAGE=./production.sqlite node server.js"
          echo "✅ Added start:production script"

      - name: Stop previous production instance
        run: |
          pm2 stop jwtauth-production 2>/dev/null || true
          pm2 delete jwtauth-production 2>/dev/null || true
          echo "✅ Previous production instance stopped"

      - name: Clean production database
        run: |
          rm -f production.sqlite
          echo "✅ Cleaned production database"

      - name: Deploy to production with PM2
        run: |
          pm2 start npm --name "jwtauth-production" -- run start:production
          pm2 save
          echo "🚀 Production deployment started with PM2 on port 3000"

      - name: Verify production deployment
        run: |
          echo "Verifying production deployment..."
          counter=1
          while [ $counter -le 10 ]; do
            if curl -f http://localhost:3000/health > /dev/null 2>&1; then
              echo "✅ Production application is ready!"
              break
            fi
            echo "Attempt $counter/10 - Production not ready yet..."
            counter=$((counter + 1))
            sleep 3
          done

          if [ $counter -gt 10 ]; then
            echo "❌ Production failed to start"
            echo "📋 PM2 status:"
            pm2 status
            echo "📋 PM2 logs:"
            pm2 logs jwtauth-production --lines 20
            exit 1
          fi

          curl -f http://localhost:3000/health
          echo ""
          curl -f http://localhost:3000/
          echo ""

      - name: Run production smoke tests
        run: |
          echo "Running production smoke tests..."
          curl -X POST http://localhost:3000/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"username":"productionuser","email":"production@example.com","password":"password123"}' \
            -w "\nHTTP Status: %{http_code}\n" || echo "User creation test completed"
          echo "✅ Production smoke tests passed"

      - name: Log deployment info
        run: |
          echo "🎉 PRODUCTION DEPLOYMENT SUCCESSFUL"
          echo "📍 URL: http://localhost:3000"
          echo "🏥 Health: http://localhost:3000/health"
          echo "📊 Environment: production"
          echo "🔧 Node: $(node --version)"
          echo "🔧 PM2: $(pm2 --version)"
          echo "🕒 Deployed at: $(date)"
          echo "📝 Commit: ${{ github.sha }}"

      - name: Upload production logs
        uses: actions/upload-artifact@v4
        with:
          name: production-deployment-logs
          path: |
            production.log
          retention-days: 30

  # Этап 4: Постоянное тестовое окружение с PM2
  deploy-test-environment:
    runs-on: self-hosted
    needs: deploy-production
    name: 🧪 Deploy Test Environment
    environment: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install dependencies
        run: npm ci

      - name: Install PM2 globally
        run: npm install -g pm2

      - name: Add start:test script to package.json
        run: |
          npm pkg set scripts.start:test="NODE_ENV=test PORT=8080 DB_STORAGE=./test.sqlite node server.js"
          echo "✅ Added start:test script"

      - name: Stop existing test application
        run: |
          pm2 stop jwtauth-test 2>/dev/null || true
          pm2 delete jwtauth-test 2>/dev/null || true
          echo "✅ Stopped existing test app"

      - name: Clean test database
        run: |
          rm -f test.sqlite
          echo "✅ Cleaned test database"

      - name: Deploy test environment with PM2
        run: |
          pm2 start npm --name "jwtauth-test" -- run start:test
          pm2 save
          echo "✅ Test environment deployed with PM2 on port 8080"

      - name: Wait for application to start
        run: |
          echo "⏳ Waiting for test environment to start..."
          sleep 25

      - name: Verify test environment
        run: |
          echo "🔍 Verifying test environment..."
          counter=1
          while [ $counter -le 10 ]; do
            if curl -f http://localhost:8080/health > /dev/null 2>&1; then
              echo "✅ Test environment is healthy (attempt $counter)"
              break
            fi
            echo "Attempt $counter/10 - Waiting..."
            counter=$((counter + 1))
            sleep 5
          done

          if [ $counter -gt 10 ]; then
            echo "❌ Test environment health check failed"
            echo "📋 PM2 status:"
            pm2 status
            echo "📋 PM2 logs:"
            pm2 logs jwtauth-test --lines 20
            exit 1
          fi

      - name: Run API tests on test environment
        run: |
          echo "🧪 Running API tests..."

          # Test public endpoint
          curl -f http://localhost:8080/api/test/all && echo "✅ Public endpoint works"

          # Test registration
          curl -X POST http://localhost:8080/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"username":"githubuser","email":"github@example.com","password":"password123"}' \
            -w "\nHTTP Status: %{http_code}\n" || echo "⚠️ Registration test completed"

      - name: Display access information
        run: |
          echo " "
          echo "🎉 DUAL ENVIRONMENT DEPLOYMENT SUCCESSFUL"
          echo "========================================"
          echo "🚀 PRODUCTION: http://localhost:3000"
          echo "🏥 Health: http://localhost:3000/health"
          echo " "
          echo "🧪 TEST: http://localhost:8080"
          echo "🏥 Health: http://localhost:8080/health"
          echo " "
          echo "🔧 PM2 Status:"
          pm2 status
          echo " "
          echo "💡 Both servers will remain running after workflow completion!"
          echo " "

      - name: Create deployment summary
        run: |
          echo "## 🎉 Dual Environment Deployment" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Both servers deployed successfully with PM2" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 🚀 Production Environment" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: http://localhost:3000" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Check**: \`http://localhost:3000/health\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 🧪 Test Environment" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: http://localhost:8080" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Check**: \`http://localhost:8080/health\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 🔧 Process Management" >> $GITHUB_STEP_SUMMARY
          echo "- **Manager**: PM2" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Both servers will remain running" >> $GITHUB_STEP_SUMMARY
          echo "- **Auto-restart**: Enabled" >> $GITHUB_STEP_SUMMARY

  # Этап 5: Откат с PM2
  rollback:
    runs-on: self-hosted
    name: Rollback Deployment
    environment: production
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Stop current production
        run: |
          pm2 stop jwtauth-production 2>/dev/null || true
          pm2 delete jwtauth-production 2>/dev/null || true
          echo "✅ Current production stopped"

      - name: Checkout previous stable version
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.rollback_commit || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install dependencies
        run: npm ci

      - name: Install PM2 globally
        run: npm install -g pm2

      - name: Deploy previous version with PM2
        run: |
          pm2 start npm --name "jwtauth-production" -- run start:production
          pm2 save
          echo "🔄 Rollback deployment started with PM2"

      - name: Verify rollback
        run: |
          echo "Verifying rollback..."
          counter=1
          while [ $counter -le 10 ]; do
            if curl -f http://localhost:3000/health > /dev/null 2>&1; then
              echo "✅ Rollback successful!"
              break
            fi
            echo "Attempt $counter/10 - Rollback not ready yet..."
            counter=$((counter + 1))
            sleep 3
          done

          if [ $counter -gt 10 ]; then
            echo "❌ Rollback failed"
            exit 1
          fi

          curl -f http://localhost:3000/health
          echo "Rollback to commit: ${{ github.event.inputs.rollback_commit || 'main' }}"

      - name: Log rollback info
        run: |
          echo "🔄 ROLLBACK COMPLETED"
          echo "📍 Rollback to: ${{ github.event.inputs.rollback_commit || 'main' }}"
          echo "🕒 Rollback time: $(date)"
          echo "📝 Current commit: $(git rev-parse HEAD)"
