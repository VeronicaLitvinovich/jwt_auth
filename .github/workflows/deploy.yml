name: Deploy to GitHub Runner

on:
  push:
    branches: [main]
  workflow_dispatch: # Позволяет запускать вручную

jobs:
  test:
    runs-on: self-hosted

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_USER: test_admin
      DB_PASSWORD: test_1234
      DB_NAME: test_lab4db
      JWT_SECRET: test-jwt-secret-key
      CLIENT_URL: http://localhost:3000
      PORT: 8080

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: test_admin
          POSTGRES_PASSWORD: test_1234
          POSTGRES_DB: test_lab4db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
          cache: "npm"

      - name: Install all dependencies (including dev)
        run: npm install

      - name: Wait for PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          timeout 60s bash -c 'until pg_isready -h localhost -p 5432; do sleep 2; done'

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Run all tests
        run: npm test

  deploy:
    needs: test
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'

    env:
      NODE_ENV: production
      DB_HOST: localhost
      DB_USER: test_admin
      DB_PASSWORD: test_1234
      DB_NAME: test_lab4db
      JWT_SECRET: production-jwt-secret-key-123
      CLIENT_URL: http://localhost:3000
      PORT: 8080

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: test_admin
          POSTGRES_PASSWORD: test_1234
          POSTGRES_DB: test_lab4db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install all dependencies (including dev for deployment tests)
        run: npm install

      - name: Wait for PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          timeout 60s bash -c 'until pg_isready -h localhost -p 5432; do sleep 2; done'

      - name: Start application
        run: |
          npm start &
          echo "Application starting in background..."
          sleep 15

      - name: Wait for application to be ready
        run: |
          timeout 120s bash -c '
            while ! curl -f http://localhost:8080/health > /dev/null 2>&1; do
              echo "Waiting for application to start..."
              sleep 5
            done
          '
          echo "✅ Application is ready!"

      - name: Test API endpoints
        run: |
          echo "🧪 Testing API endpoints..."

          # Test health endpoint
          echo "1. Testing health endpoint..."
          curl -f http://localhost:8080/health
          echo -e "\n✅ Health check passed"

          # Test main endpoint
          echo -e "\n2. Testing main endpoint..."
          curl -f http://localhost:8080/
          echo -e "\n✅ Main endpoint passed"

          # Test user registration
          echo -e "\n3. Testing user registration..."
          curl -X POST http://localhost:8080/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"username":"githubuser","email":"github@example.com","password":"password123"}' \
            -w "\nHTTP Status: %{http_code}\n" || echo "Registration test completed"

          # Test user login
          echo -e "\n4. Testing user login..."
          curl -X POST http://localhost:8080/api/auth/signin \
            -H "Content-Type: application/json" \
            -d '{"username":"githubuser","password":"password123"}' \
            -w "\nHTTP Status: %{http_code}\n" || echo "Login test completed"

          echo -e "\n🎉 All API tests completed!"

      - name: Keep application running for demonstration
        run: |
          echo "🚀 Application is successfully running on GitHub Runner"
          echo "📍 Health check: http://localhost:8080/health"
          echo "📍 Main endpoint: http://localhost:8080/"
          echo "📍 API documentation available at root endpoint"
          echo "⏰ Keeping application alive for 10 seconds for demonstration..."
          sleep 10
