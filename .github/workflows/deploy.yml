name: Full CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_ENV: test
  DB_DIALECT: sqlite

jobs:
  build-and-unit-tests:
    runs-on: self-hosted
    name: Build and Unit Tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --production --audit-level=high

      - name: Run unit tests with coverage
        run: |
          npm run test:unit
        env:
          NODE_ENV: test

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage/
          retention-days: 7

  # Этап 2: Деплой на staging и интеграционные тесты
  deploy-staging-and-integration-tests:
    runs-on: self-hosted
    needs: build-and-unit-tests
    environment: staging
    name: Deploy to Staging & Integration Tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install dependencies
        run: npm ci

      - name: Download unit test coverage
        uses: actions/download-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage/

      - name: Deploy to staging environment
        run: |
          export PORT=3001
          export NODE_ENV=staging
          export DB_STORAGE=./staging.sqlite
          npm start &
          echo "🚀 Staging deployment started on port 3001"
          sleep 15

      - name: Wait for staging to be ready (macOS compatible)
        run: |
          echo "Waiting for staging application..."
          counter=1
          while [ $counter -le 10 ]; do
            if curl -f http://localhost:3001/health > /dev/null 2>&1; then
              echo "✅ Staging application is ready!"
              break
            fi
            echo "Attempt $counter/10 - Staging not ready yet..."
            counter=$((counter + 1))
            sleep 3
          done

          if [ $counter -gt 10 ]; then
            echo "❌ Staging failed to start"
            exit 1
          fi

      - name: Run integration tests against staging
        run: |
          export TEST_BASE_URL=http://localhost:3001
          npm run test:integration
        env:
          NODE_ENV: test

      - name: API smoke tests
        run: |
          echo "Running API smoke tests on staging..."

          # Health check
          curl -f http://localhost:3001/health
          echo "✅ Health check passed"

          # Main endpoint
          curl -f http://localhost:3001/
          echo "✅ Main endpoint passed"

          # Test authentication endpoints
          curl -X POST http://localhost:3001/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"username":"staginguser","email":"staging@example.com","password":"password123"}' \
            -w "\nHTTP Status: %{http_code}\n" || echo "User creation test completed"

          echo "✅ Staging environment verified"

      - name: Upload staging test results
        uses: actions/upload-artifact@v4
        with:
          name: staging-test-results
          path: |
            test-results/
            coverage/
          retention-days: 7

  # Этап 3: Деплой в production
  deploy-production:
    runs-on: self-hosted
    needs: deploy-staging-and-integration-tests
    environment: production
    name: Deploy to Production
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install dependencies
        run: npm ci

      - name: Stop previous production instance
        run: |
          # Останавливаем предыдущую версию приложения
          pkill -f "node.*server.js" || true
          sleep 3
          echo "✅ Previous instance stopped"

      - name: Deploy to production
        run: |
          export PORT=3000
          export NODE_ENV=production
          export DB_STORAGE=./production.sqlite
          nohup npm start > production.log 2>&1 &
          echo $! > app.pid
          echo "🚀 Production deployment started on port 3000"
          sleep 20

      - name: Verify production deployment
        run: |
          echo "Verifying production deployment..."
          counter=1
          while [ $counter -le 10 ]; do
            if curl -f http://localhost:3000/health > /dev/null 2>&1; then
              echo "✅ Production application is ready!"
              break
            fi
            echo "Attempt $counter/10 - Production not ready yet..."
            counter=$((counter + 1))
            sleep 3
          done

          if [ $counter -gt 10 ]; then
            echo "❌ Production failed to start"
            exit 1
          fi

          # Comprehensive production checks
          curl -f http://localhost:3000/health
          echo ""
          curl -f http://localhost:3000/
          echo ""

          # Check application process
          if ps -p $(cat app.pid) > /dev/null; then
            echo "✅ Application process is running (PID: $(cat app.pid))"
          else
            echo "❌ Application process failed"
            exit 1
          fi

      - name: Run production smoke tests
        run: |
          echo "Running production smoke tests..."

          # Test critical user journey
          curl -X POST http://localhost:3000/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"username":"productionuser","email":"production@example.com","password":"password123"}' \
            -w "\nHTTP Status: %{http_code}\n" || echo "User creation test completed"

          echo "✅ Production smoke tests passed"

      - name: Log deployment info
        run: |
          echo "🎉 PRODUCTION DEPLOYMENT SUCCESSFUL"
          echo "📍 URL: http://localhost:3000"
          echo "🏥 Health: http://localhost:3000/health"
          echo "📊 Environment: production"
          echo "🔧 Node: $(node --version)"
          echo "🕒 Deployed at: $(date)"
          echo "📝 Commit: ${{ github.sha }}"

      - name: Upload production logs
        uses: actions/upload-artifact@v4
        with:
          name: production-deployment-logs
          path: |
            production.log
            app.pid
          retention-days: 30

  # Этап 4: Мониторинг без health check
  monitoring:
    runs-on: self-hosted
    needs: deploy-production
    name: Production Monitoring (No Health Endpoint)
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Basic application availability check
        run: |
          echo "🔍 BASIC APPLICATION MONITORING"
          echo "================================"

          # Проверяем что приложение отвечает на порту 3000
          echo "Checking if application is running on port 3000..."

          # Простая проверка подключения к порту
          if nc -z localhost 3000 || (curl -s -o /dev/null --connect-timeout 5 http://localhost:3000 && echo "Port 3000 is open"); then
            echo "✅ Application is running on port 3000"
          else
            echo "❌ Application is not responding on port 3000"
            exit 1
          fi

      - name: Process and system monitoring
        run: |
          echo " "
          echo "⚡ PROCESS & SYSTEM MONITORING"
          echo "=============================="

          # Проверка Node.js процессов
          echo "🔍 Node.js Processes:"
          node_processes=$(ps aux | grep -c "[n]ode" || echo "0")
          echo "  Running Node.js processes: $node_processes"

          if [ "$node_processes" -gt 0 ]; then
            echo "✅ Node.js application is running"
            # Показываем топ процессов Node.js
            ps aux | grep "[n]ode" | head -3 | awk '{print "  PID: "$2", CPU: "$3"%, MEM: "$4"%, COMMAND: "$11}'
          else
            echo "❌ No Node.js processes found"
            exit 1
          fi

          # Системные метрики
          echo " "
          echo "💻 SYSTEM METRICS:"
          echo "  Load average: $(uptime | awk -F'load average:' '{print $2}' | cut -d',' -f1 | xargs)"
          echo "  Uptime: $(uptime | awk -F'up' '{print $2}' | awk -F',' '{print $1}' | xargs)"

          # Память
          if [ "$(uname)" = "Darwin" ]; then
            # macOS
            memory_pressure=$(memory_pressure | grep "System-wide memory free percentage:" | awk '{print $5}' || echo "N/A")
            echo "  Memory free: ${memory_pressure}%"
          else
            # Linux
            memory_free=$(free -m | grep Mem | awk '{printf "%.1f%%", $4/$2 * 100}')
            echo "  Memory free: $memory_free"
          fi

          # Диск
          disk_free=$(df -h . | awk 'NR==2 {print $4}')
          disk_usage=$(df -h . | awk 'NR==2 {print $5}')
          echo "  Disk free: $disk_free"
          echo "  Disk usage: $disk_usage"

      - name: Application functionality testing
        run: |
          echo " "
          echo "🚀 APPLICATION FUNCTIONALITY TESTING"
          echo "==================================="

          # Проверяем основные endpoints без health check
          endpoints=("/" "/api/auth/signup" "/api/auth/login")

          for endpoint in "${endpoints[@]}"; do
            echo "Testing $endpoint..."
            
            # Пробуем разные методы проверки
            response=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 "http://localhost:3000$endpoint" 2>/dev/null || echo "000")
            
            case $response in
              "200"|"201"|"400"|"404")
                echo "  ✅ $endpoint: Responding (HTTP $response)"
                ;;
              "000")
                # Пробуем альтернативный метод - проверка времени ответа
                start_time=$(date +%s%N)
                if curl -s --connect-timeout 5 "http://localhost:3000$endpoint" > /dev/null 2>&1; then
                  end_time=$(date +%s%N)
                  response_time=$(( (end_time - start_time) / 1000000 ))
                  echo "  ✅ $endpoint: Responding (${response_time}ms)"
                else
                  echo "  ⚠️  $endpoint: Slow or no response"
                fi
                ;;
              *)
                echo "  ⚠️  $endpoint: HTTP $response"
                ;;
            esac
          done

      - name: Error and log monitoring
        run: |
          echo " "
          echo "📊 ERROR & LOG MONITORING"
          echo "========================="

          # Проверяем логи на ошибки
          log_files=("production.log" "app.log" "logs/app.log")
          log_found=false

          for log_file in "${log_files[@]}"; do
            if [ -f "$log_file" ]; then
              echo "📄 Analyzing $log_file:"
              log_found=true
              
              # Считаем ошибки
              errors=$(grep -c -i "error" "$log_file" 2>/dev/null || echo "0")
              warnings=$(grep -c -i "warn" "$log_file" 2>/dev/null || echo "0")
              exceptions=$(grep -c -i "exception" "$log_file" 2>/dev/null || echo "0")
              
              echo "  Errors: $errors, Warnings: $warnings, Exceptions: $exceptions"
              
              # Показываем последние ошибки если есть
              if [ "$errors" -gt 0 ]; then
                echo "  Recent errors:"
                grep -i "error" "$log_file" | tail -2 | sed 's/^/    /' || echo "    No recent errors"
              fi
              break
            fi
          done

          if [ "$log_found" = "false" ]; then
            echo "ℹ️  No log files found for analysis"
          fi

          # Проверяем системные логи на предмет ошибок приложения
          echo " "
          echo "🔍 System Logs Check:"
          if command -v logshow > /dev/null 2>&1; then
            # macOS
            recent_errors=$(log show --last 1h --predicate 'process == "node" || sender == "node"' --info 2>/dev/null | grep -i -c "error\|fail" || echo "0")
            echo "  Recent system log errors: $recent_errors"
          elif command -v journalctl > /dev/null 2>&1; then
            # Linux
            recent_errors=$(journalctl --since "1 hour ago" | grep -i -c "node.*error\|node.*fail" || echo "0")
            echo "  Recent system log errors: $recent_errors"
          else
            echo "  System log check: tool not available"
          fi

      - name: Performance and load testing
        run: |
          echo " "
          echo "⚡ PERFORMANCE & LOAD TESTING"
          echo "============================"

          # Базовый тест производительности
          echo "Basic performance test:"

          # Тестируем корневой endpoint
          total_time=0
          successful_requests=0

          for i in {1..5}; do
            start_time=$(date +%s%N)
            if curl -s --connect-timeout 5 "http://localhost:3000/" > /dev/null 2>&1; then
              end_time=$(date +%s%N)
              response_time=$(( (end_time - start_time) / 1000000 ))
              total_time=$((total_time + response_time))
              successful_requests=$((successful_requests + 1))
              echo "  Request $i: ${response_time}ms"
            else
              echo "  Request $i: timeout/failed"
            fi
          done

          if [ $successful_requests -gt 0 ]; then
            avg_time=$((total_time / successful_requests))
            echo "  📊 Average response time: ${avg_time}ms"
            echo "  📈 Success rate: $successful_requests/5 ($((successful_requests * 100 / 5))%)"
          fi

          # Простой нагрузочный тест
          echo " "
          echo "Simple load test (5 concurrent requests):"
          start_time=$(date +%s)

          for i in {1..5}; do
            curl -s --connect-timeout 10 "http://localhost:3000/" > /dev/null 2>&1 &
          done

          wait
          end_time=$(date +%s)
          echo "  ✅ 5 concurrent requests completed in $((end_time - start_time)) seconds"

      - name: Resource monitoring
        run: |
          echo " "
          echo "💾 RESOURCE MONITORING"
          echo "======================"

          # Проверяем использование портов
          echo "🌐 Network Ports:"
          if command -v lsof > /dev/null; then
            port_3000_usage=$(lsof -i :3000 2>/dev/null | grep LISTEN | head -1 | awk '{print $1 " (PID: " $2 ")"}' || echo "Not found")
            echo "  Port 3000: $port_3000_usage"
          else
            # Альтернатива без lsof
            if netstat -tuln 2>/dev/null | grep -q ":3000 "; then
              echo "  Port 3000: In use"
            else
              echo "  Port 3000: Not in use"
            fi
          fi

          # Проверяем файлы базы данных
          echo " "
          echo "🗄️ Database & Files:"
          if [ -f "production.sqlite" ]; then
            db_size=$(du -h production.sqlite | cut -f1)
            echo "  Database size: $db_size"
          else
            echo "  Database: Not found"
          fi

          # Проверяем использование файловых дескрипторов процессом Node.js
          node_pid=$(ps aux | grep "[n]ode" | head -1 | awk '{print $2}' || echo "")
          if [ -n "$node_pid" ]; then
            echo "  Node.js PID: $node_pid"
            if command -v lsof > /dev/null; then
              fd_count=$(lsof -p "$node_pid" 2>/dev/null | wc -l || echo "N/A")
              echo "  Open files: $fd_count"
            fi
          fi

      - name: Generate monitoring report
        run: |
          echo " "
          echo "📋 MONITORING SUMMARY REPORT"
          echo "============================"
          echo "🕒 Monitoring completed: $(date)"
          echo "📍 Application URL: http://localhost:3000"
          echo "🔧 Environment: Production"
          echo "💻 System: $(uname -s) $(uname -m)"
          echo " "

          # Финальная оценка состояния
          echo "📊 STATUS ASSESSMENT:"

          # Проверяем несколько критериев
          node_processes=$(ps aux | grep -c "[n]ode" || echo "0")
          port_open=$(curl -s -o /dev/null --connect-timeout 3 -w "%{http_code}" http://localhost:3000/ 2>/dev/null || echo "000")

          if [ "$node_processes" -gt 0 ]; then
            echo "✅ Node.js processes: RUNNING"
          else
            echo "❌ Node.js processes: STOPPED"
          fi

          if [ "$port_open" != "000" ]; then
            echo "✅ Application port: RESPONDING"
          else
            echo "❌ Application port: NOT RESPONDING"
          fi

          # Общий статус
          if [ "$node_processes" -gt 0 ] && [ "$port_open" != "000" ]; then
            echo " "
            echo "🎉 OVERALL STATUS: HEALTHY"
            echo "✅ Application is running and responding"
            echo "✅ System resources are available"
            echo "✅ Basic functionality confirmed"
          else
            echo " "
            echo "❌ OVERALL STATUS: UNHEALTHY"
            echo "💥 Application issues detected"
            exit 1
          fi

  # Этап 5: Откат
  rollback:
    runs-on: self-hosted
    name: Rollback Deployment
    environment: production
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Stop current production
        run: |
          echo "Stopping current production deployment..."
          pkill -f "node.*server.js" || true
          sleep 5
          echo "✅ Current production stopped"

      - name: Checkout previous stable version
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.rollback_commit || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install dependencies
        run: npm ci

      - name: Deploy previous version
        run: |
          export PORT=3000
          export NODE_ENV=production
          export DB_STORAGE=./production.sqlite
          nohup npm start > rollback.log 2>&1 &
          echo $! > rollback.pid
          echo "🔄 Rollback deployment started"
          sleep 20

      - name: Verify rollback
        run: |
          echo "Verifying rollback..."
          counter=1
          while [ $counter -le 10 ]; do
            if curl -f http://localhost:3000/health > /dev/null 2>&1; then
              echo "✅ Rollback successful!"
              break
            fi
            echo "Attempt $counter/10 - Rollback not ready yet..."
            counter=$((counter + 1))
            sleep 3
          done

          if [ $counter -gt 10 ]; then
            echo "❌ Rollback failed"
            exit 1
          fi

          curl -f http://localhost:3000/health
          echo "Rollback to commit: ${{ github.event.inputs.rollback_commit || 'main' }}"

      - name: Log rollback info
        run: |
          echo "🔄 ROLLBACK COMPLETED"
          echo "📍 Rollback to: ${{ github.event.inputs.rollback_commit || 'main' }}"
          echo "🕒 Rollback time: $(date)"
          echo "📝 Current commit: $(git rev-parse HEAD)"
