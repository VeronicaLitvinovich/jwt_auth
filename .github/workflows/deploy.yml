name: Full CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_ENV: test
  DB_DIALECT: sqlite

jobs:
  build-and-unit-tests:
    runs-on: self-hosted
    name: Build and Unit Tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --production --audit-level=high

      - name: Run unit tests with coverage
        run: |
          npm run test:unit
        env:
          NODE_ENV: test

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage/
          retention-days: 7

  # Этап 2: Деплой на staging и интеграционные тесты
  deploy-staging-and-integration-tests:
    runs-on: self-hosted
    needs: build-and-unit-tests
    environment: staging
    name: Deploy to Staging & Integration Tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install dependencies
        run: npm ci

      - name: Download unit test coverage
        uses: actions/download-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage/

      - name: Deploy to staging environment
        run: |
          export PORT=3001
          export NODE_ENV=staging
          export DB_STORAGE=./staging.sqlite
          npm start &
          echo "🚀 Staging deployment started on port 3001"
          sleep 15

      - name: Wait for staging to be ready
        run: |
          echo "Waiting for staging application..."
          counter=1
          while [ $counter -le 10 ]; do
            if curl -f http://localhost:3001/health > /dev/null 2>&1; then
              echo "✅ Staging application is ready!"
              break
            fi
            echo "Attempt $counter/10 - Staging not ready yet..."
            counter=$((counter + 1))
            sleep 3
          done

          if [ $counter -gt 10 ]; then
            echo "❌ Staging failed to start"
            exit 1
          fi

      - name: Run integration tests against staging
        run: |
          export TEST_BASE_URL=http://localhost:3001
          npm run test:integration
        env:
          NODE_ENV: test

      - name: API smoke tests
        run: |
          echo "Running API smoke tests on staging..."

          # Health check
          curl -f http://localhost:3001/health
          echo "✅ Health check passed"

          # Main endpoint
          curl -f http://localhost:3001/
          echo "✅ Main endpoint passed"

          # Test authentication endpoints
          curl -X POST http://localhost:3001/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"username":"staginguser","email":"staging@example.com","password":"password123"}' \
            -w "\nHTTP Status: %{http_code}\n" || echo "User creation test completed"

          echo "✅ Staging environment verified"

      - name: Upload staging test results
        uses: actions/upload-artifact@v4
        with:
          name: staging-test-results
          path: |
            test-results/
            coverage/
          retention-days: 7

  # Этап 3: Деплой в production
  deploy-production:
    runs-on: self-hosted
    needs: deploy-staging-and-integration-tests
    environment: production
    name: Deploy to Production
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install dependencies
        run: npm ci

      - name: Stop previous production instance
        run: |
          # Останавливаем предыдущую версию приложения
          pkill -f "node.*server.js" || true
          sleep 3
          echo "✅ Previous instance stopped"

      - name: Deploy to production
        run: |
          export PORT=3000
          export NODE_ENV=production
          export DB_STORAGE=./production.sqlite
          nohup npm start > production.log 2>&1 &
          echo $! > app.pid
          echo "🚀 Production deployment started on port 3000"
          sleep 20

      - name: Verify production deployment
        run: |
          echo "Verifying production deployment..."
          counter=1
          while [ $counter -le 10 ]; do
            if curl -f http://localhost:3000/health > /dev/null 2>&1; then
              echo "✅ Production application is ready!"
              break
            fi
            echo "Attempt $counter/10 - Production not ready yet..."
            counter=$((counter + 1))
            sleep 3
          done

          if [ $counter -gt 10 ]; then
            echo "❌ Production failed to start"
            exit 1
          fi

          # Comprehensive production checks
          curl -f http://localhost:3000/health
          echo ""
          curl -f http://localhost:3000/
          echo ""

          # Check application process
          if ps -p $(cat app.pid) > /dev/null; then
            echo "✅ Application process is running (PID: $(cat app.pid))"
          else
            echo "❌ Application process failed"
            exit 1
          fi

      - name: Run production smoke tests
        run: |
          echo "Running production smoke tests..."

          # Test critical user journey
          curl -X POST http://localhost:3000/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"username":"productionuser","email":"production@example.com","password":"password123"}' \
            -w "\nHTTP Status: %{http_code}\n" || echo "User creation test completed"

          echo "✅ Production smoke tests passed"

      - name: Log deployment info
        run: |
          echo "🎉 PRODUCTION DEPLOYMENT SUCCESSFUL"
          echo "📍 URL: http://localhost:3000"
          echo "🏥 Health: http://localhost:3000/health"
          echo "📊 Environment: production"
          echo "🔧 Node: $(node --version)"
          echo "🕒 Deployed at: $(date)"
          echo "📝 Commit: ${{ github.sha }}"

      - name: Upload production logs
        uses: actions/upload-artifact@v4
        with:
          name: production-deployment-logs
          path: |
            production.log
            app.pid
          retention-days: 30
        # Этап 5: Тестовое окружение с доступом по ссылке
  test-environment:
    runs-on: self-hosted
    needs: deploy-production
    name: Test Environment with Public URL
    environment: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install dependencies
        run: npm ci

      - name: Stop previous test instances
        run: |
          echo "🛑 Stopping previous test instances..."
          pkill -f "node.*server.js.*8080" || true
          sleep 3

      - name: Deploy test environment
        run: |
          export PORT=8080
          export NODE_ENV=test
          export DB_STORAGE=./test.sqlite
          nohup npm start > test.log 2>&1 &
          echo $! > test.pid
          echo "🚀 Test environment started on port 8080"
          sleep 20

      - name: Verify test environment
        run: |
          echo "Verifying test environment..."
          counter=1
          while [ $counter -le 10 ]; do
            if curl -f http://localhost:8080/health > /dev/null 2>&1; then
              echo "✅ Test environment is ready!"
              break
            fi
            echo "Attempt $counter/10 - Test environment not ready yet..."
            counter=$((counter + 1))
            sleep 3
          done

          if [ $counter -gt 10 ]; then
            echo "❌ Test environment failed to start"
            exit 1
          fi

      - name: Get server information
        id: server-info
        run: |
          # Получаем IP адрес сервера
          SERVER_IP=$(hostname -I | awk '{print $1}' || echo "localhost")
          echo "server_ip=$SERVER_IP" >> $GITHUB_OUTPUT
          echo "👉 Test environment available at: http://$SERVER_IP:8080"

      - name: Display JWT Auth endpoints
        run: |
          echo "🔐 JWT AUTH TEST ENDPOINTS:"
          echo "============================"
          echo "🌐 Main URL: http://${{ steps.server-info.outputs.server_ip }}:8080"
          echo "🏥 Health: http://${{ steps.server-info.outputs.server_ip }}:8080/health"
          echo "📊 Metrics: http://${{ steps.server-info.outputs.server_ip }}:8080/metrics"
          echo ""
          echo "🔐 AUTHENTICATION ENDPOINTS:"
          echo "POST http://${{ steps.server-info.outputs.server_ip }}:8080/api/auth/signup"
          echo "POST http://${{ steps.server-info.outputs.server_ip }}:8080/api/auth/signin"
          echo ""
          echo "👤 USER ENDPOINTS:"
          echo "GET http://${{ steps.server-info.outputs.server_ip }}:8080/api/test/all"
          echo "GET http://${{ steps.server-info.outputs.server_ip }}:8080/api/test/user (requires auth)"
          echo "GET http://${{ steps.server-info.outputs.server_ip }}:8080/api/test/admin (requires admin)"
          echo ""
          echo "📝 Example registration:"
          echo 'curl -X POST http://${{ steps.server-info.outputs.server_ip }}:8080/api/auth/signup \'
          echo '  -H "Content-Type: application/json" \'
          echo '  -d '\''{"username":"testuser","email":"test@example.com","password":"password123"}'\'''

      - name: Run test environment verification
        run: |
          echo "🧪 Running test environment verification..."
          sleep 10

          # Простая проверка что приложение отвечает
          if curl -f --max-time 10 http://localhost:8080/health; then
            echo "✅ Health check passed"
            echo "🌐 Public endpoint test:"
            curl -s http://localhost:8080/api/test/all || echo "Public endpoint test skipped"
            echo "🎉 Test environment is working!"
          else
            echo "❌ Health check failed"
            echo "📋 Checking application status..."
            ps aux | grep node || echo "No node processes found"
            echo "📋 Last logs:"
            tail -20 test.log || echo "No log file"
            exit 1
          fi

      - name: Upload test environment logs
        uses: actions/upload-artifact@v4
        with:
          name: test-environment-logs
          path: |
            test.log
            test.pid
          retention-days: 7

      - name: Log test environment info
        run: |
          echo "🎉 TEST ENVIRONMENT DEPLOYED SUCCESSFULLY"
          echo "📍 Access URL: http://${{ steps.server-info.outputs.server_ip }}:8080"
          echo "🔐 JWT Auth endpoints are ready for testing"
          echo "📊 Environment: test"
          echo "🔧 Node: $(node --version)"
          echo "🕒 Deployed at: $(date)"
          echo "📝 Commit: ${{ github.sha }}"

    # Этап 4: Откат
  rollback:
    runs-on: self-hosted
    name: Rollback Deployment
    environment: production
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Stop current production
        run: |
          echo "Stopping current production deployment..."
          pkill -f "node.*server.js" || true
          sleep 5
          echo "✅ Current production stopped"

      - name: Checkout previous stable version
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.rollback_commit || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install dependencies
        run: npm ci

      - name: Deploy previous version
        run: |
          export PORT=3000
          export NODE_ENV=production
          export DB_STORAGE=./production.sqlite
          nohup npm start > rollback.log 2>&1 &
          echo $! > rollback.pid
          echo "🔄 Rollback deployment started"
          sleep 20

      - name: Verify rollback
        run: |
          echo "Verifying rollback..."
          counter=1
          while [ $counter -le 10 ]; do
            if curl -f http://localhost:3000/health > /dev/null 2>&1; then
              echo "✅ Rollback successful!"
              break
            fi
            echo "Attempt $counter/10 - Rollback not ready yet..."
            counter=$((counter + 1))
            sleep 3
          done

          if [ $counter -gt 10 ]; then
            echo "❌ Rollback failed"
            exit 1
          fi

          curl -f http://localhost:3000/health
          echo "Rollback to commit: ${{ github.event.inputs.rollback_commit || 'main' }}"

      - name: Log rollback info
        run: |
          echo "🔄 ROLLBACK COMPLETED"
          echo "📍 Rollback to: ${{ github.event.inputs.rollback_commit || 'main' }}"
          echo "🕒 Rollback time: $(date)"
          echo "📝 Current commit: $(git rev-parse HEAD)"
