name: Full CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_ENV: test
  DB_DIALECT: sqlite

jobs:
  build-and-unit-tests:
    runs-on: self-hosted
    name: Build and Unit Tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --production --audit-level=high

      - name: Run unit tests with coverage
        run: |
          npm run test:unit
        env:
          NODE_ENV: test

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage/
          retention-days: 7

  # Этап 2: Деплой на staging и интеграционные тесты
  deploy-staging-and-integration-tests:
    runs-on: self-hosted
    needs: build-and-unit-tests
    environment: staging
    name: Deploy to Staging & Integration Tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install dependencies
        run: npm ci

      - name: Download unit test coverage
        uses: actions/download-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage/

      - name: Deploy to staging environment
        run: |
          export PORT=3001
          export NODE_ENV=staging
          export DB_STORAGE=./staging.sqlite
          npm start &
          echo "🚀 Staging deployment started on port 3001"
          sleep 15

      - name: Wait for staging to be ready (macOS compatible)
        run: |
          echo "Waiting for staging application..."
          counter=1
          while [ $counter -le 10 ]; do
            if curl -f http://localhost:3001/health > /dev/null 2>&1; then
              echo "✅ Staging application is ready!"
              break
            fi
            echo "Attempt $counter/10 - Staging not ready yet..."
            counter=$((counter + 1))
            sleep 3
          done

          if [ $counter -gt 10 ]; then
            echo "❌ Staging failed to start"
            exit 1
          fi

      - name: Run integration tests against staging
        run: |
          export TEST_BASE_URL=http://localhost:3001
          npm run test:integration
        env:
          NODE_ENV: test

      - name: API smoke tests
        run: |
          echo "Running API smoke tests on staging..."

          # Health check
          curl -f http://localhost:3001/health
          echo "✅ Health check passed"

          # Main endpoint
          curl -f http://localhost:3001/
          echo "✅ Main endpoint passed"

          # Test authentication endpoints
          curl -X POST http://localhost:3001/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"username":"staginguser","email":"staging@example.com","password":"password123"}' \
            -w "\nHTTP Status: %{http_code}\n" || echo "User creation test completed"

          echo "✅ Staging environment verified"

      - name: Upload staging test results
        uses: actions/upload-artifact@v4
        with:
          name: staging-test-results
          path: |
            test-results/
            coverage/
          retention-days: 7

  # Этап 3: Деплой в production
  deploy-production:
    runs-on: self-hosted
    needs: deploy-staging-and-integration-tests
    environment: production
    name: Deploy to Production
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install dependencies
        run: npm ci

      - name: Stop previous production instance
        run: |
          # Останавливаем предыдущую версию приложения
          pkill -f "node.*server.js" || true
          sleep 3
          echo "✅ Previous instance stopped"

      - name: Deploy to production
        run: |
          export PORT=3000
          export NODE_ENV=production
          export DB_STORAGE=./production.sqlite
          nohup npm start > production.log 2>&1 &
          echo $! > app.pid
          echo "🚀 Production deployment started on port 3000"
          sleep 20

      - name: Verify production deployment
        run: |
          echo "Verifying production deployment..."
          counter=1
          while [ $counter -le 10 ]; do
            if curl -f http://localhost:3000/health > /dev/null 2>&1; then
              echo "✅ Production application is ready!"
              break
            fi
            echo "Attempt $counter/10 - Production not ready yet..."
            counter=$((counter + 1))
            sleep 3
          done

          if [ $counter -gt 10 ]; then
            echo "❌ Production failed to start"
            exit 1
          fi

          # Comprehensive production checks
          curl -f http://localhost:3000/health
          echo ""
          curl -f http://localhost:3000/
          echo ""

          # Check application process
          if ps -p $(cat app.pid) > /dev/null; then
            echo "✅ Application process is running (PID: $(cat app.pid))"
          else
            echo "❌ Application process failed"
            exit 1
          fi

      - name: Run production smoke tests
        run: |
          echo "Running production smoke tests..."

          # Test critical user journey
          curl -X POST http://localhost:3000/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"username":"productionuser","email":"production@example.com","password":"password123"}' \
            -w "\nHTTP Status: %{http_code}\n" || echo "User creation test completed"

          echo "✅ Production smoke tests passed"

      - name: Log deployment info
        run: |
          echo "🎉 PRODUCTION DEPLOYMENT SUCCESSFUL"
          echo "📍 URL: http://localhost:3000"
          echo "🏥 Health: http://localhost:3000/health"
          echo "📊 Environment: production"
          echo "🔧 Node: $(node --version)"
          echo "🕒 Deployed at: $(date)"
          echo "📝 Commit: ${{ github.sha }}"

      - name: Upload production logs
        uses: actions/upload-artifact@v4
        with:
          name: production-deployment-logs
          path: |
            production.log
            app.pid
          retention-days: 30

    # Этап 4: Комплексный мониторинг ключевых показателей
  monitoring:
    runs-on: self-hosted
    needs: deploy-production
    name: Comprehensive Production Monitoring
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Detailed application status check
        run: |
          echo "🔍 DETAILED APPLICATION STATUS"
          echo "=============================="

          # Проверяем процессы Node.js более детально
          echo "Node.js Processes Analysis:"
          node_processes=$(ps aux | grep -c "[n]ode" || echo "0")
          echo "Total Node.js processes: $node_processes"

          if [ "$node_processes" -gt 0 ]; then
            echo "Active Node.js processes:"
            ps aux | grep "[n]ode" | head -10 | awk '{print "  PID: "$2", CPU: "$3"%, MEM: "$4"%, CMD: "$11$12}'
          else
            echo "❌ CRITICAL: No Node.js processes found"
            exit 1
          fi

          # Проверяем порт 3000 разными способами
          echo "Port 3000 Detailed Check:"
          if lsof -i :3000 > /dev/null 2>&1; then
            echo "✅ Port 3000: OPEN (lsof)"
            lsof -i :3000 | head -3
          elif netstat -tuln 2>/dev/null | grep -q ":3000 "; then
            echo "✅ Port 3000: OPEN (netstat)"
          elif curl -s --connect-timeout 5 http://localhost:3000 > /dev/null 2>&1; then
            echo "✅ Port 3000: HTTP RESPONSE"
          else
            echo "❌ CRITICAL: Port 3000 is not accessible"
            echo "Application may be running on wrong port or not running"
          fi

      - name: System load and resource monitoring
        run: |
          echo " "
          echo "⚡ SYSTEM LOAD AND RESOURCE MONITORING"
          echo "======================================"

          # Детальная информация о нагрузке
          echo "System Uptime and Load:"
          uptime

          echo " "
          echo "Memory Usage Details:"
          if [ "$(uname)" = "Darwin" ]; then
            # macOS детальная информация о памяти
            echo "Physical Memory:"
            vm_stat | grep -E "(Pages active|Pages wired|Pages free)" | while read line; do
              echo "  $line"
            done
            memory_pressure=$(memory_pressure 2>/dev/null | grep -E "System-wide memory free percentage:" || echo "")
            if [ -n "$memory_pressure" ]; then
              echo "  $memory_pressure"
            fi
          else
            free -h || echo "Memory info not available"
          fi

          echo " "
          echo "Disk Usage Analysis:"
          df -h . | while read line; do
            echo "  $line"
          done

          echo " "
          echo "CPU and Process Load:"
          if [ "$(uname)" = "Darwin" ]; then
            top -l 1 -s 0 -o cpu -n 5 -stats pid,command,cpu,mem | head -15 2>/dev/null || echo "Top command not available"
          else
            top -bn1 -o %CPU | head -10 2>/dev/null || echo "Top command not available"
          fi

      - name: Error analysis and log monitoring
        run: |
          echo " "
          echo "📊 ERROR ANALYSIS AND LOG MONITORING"
          echo "===================================="

          # Детальный анализ ошибок в логах
          total_errors=0
          log_files=$(find . -name "*.log" -type f 2>/dev/null)

          if [ -n "$log_files" ]; then
            echo "Found log files:"
            echo "$log_files"
            echo " "
            
            for log_file in $log_files; do
              echo "Analyzing $log_file:"
              
              # Разные типы ошибок
              errors=$(grep -c -i "error" "$log_file" 2>/dev/null || echo "0")
              fatal=$(grep -c -i "fatal" "$log_file" 2>/dev/null || echo "0")
              exception=$(grep -c -i "exception" "$log_file" 2>/dev/null || echo "0")
              warn=$(grep -c -i "warn" "$log_file" 2>/dev/null || echo "0")
              
              total_errors=$((total_errors + errors + fatal + exception))
              
              echo "  Errors: $errors, Fatal: $fatal, Exceptions: $exception, Warnings: $warn"
              
              # Показываем последние критические ошибки
              if [ "$errors" -gt 0 ] || [ "$fatal" -gt 0 ]; then
                echo "  Recent critical errors:"
                grep -i -E "error|fatal" "$log_file" | tail -3 | sed 's/^/    /' || echo "    No recent critical errors"
              fi
              echo "---"
            done
          else
            echo "No log files found for analysis"
          fi

          echo " "
          echo "📈 ERROR SUMMARY:"
          echo "Total errors across all logs: $total_errors"

          # Оцениваем серьезность ситуации с ошибками
          if [ "$total_errors" -eq 0 ]; then
            echo "✅ ERROR STATUS: EXCELLENT - No errors found"
          elif [ "$total_errors" -lt 5 ]; then
            echo "⚠️  ERROR STATUS: ACCEPTABLE - Few errors detected"
          elif [ "$total_errors" -lt 20 ]; then
            echo "⚠️  ERROR STATUS: CONCERNING - Multiple errors detected"
          else
            echo "❌ ERROR STATUS: CRITICAL - High error count"
          fi

      - name: Performance and responsiveness testing
        run: |
          echo " "
          echo "🚀 PERFORMANCE AND RESPONSIVENESS TESTING"
          echo "========================================="

          # Тестируем разные endpoints на производительность
          endpoints=("/" "/health" "/api/auth/signup")

          for endpoint in "${endpoints[@]}"; do
            echo "Testing $endpoint:"
            
            successful_requests=0
            total_response_time=0
            max_response_time=0
            min_response_time=9999
            
            for i in {1..5}; do
              start_time=$(date +%s%N)
              http_code=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 "http://localhost:3000$endpoint" 2>/dev/null || echo "000")
              end_time=$(date +%s%N)
              
              if [ "$http_code" = "200" ] || [ "$http_code" = "201" ] || [ "$http_code" = "400" ]; then
                response_time=$(( (end_time - start_time) / 1000000 ))
                total_response_time=$((total_response_time + response_time))
                successful_requests=$((successful_requests + 1))
                
                # Обновляем min/max
                if [ "$response_time" -lt "$min_response_time" ]; then
                  min_response_time=$response_time
                fi
                if [ "$response_time" -gt "$max_response_time" ]; then
                  max_response_time=$response_time
                fi
                
                echo "  Request $i: ${response_time}ms (HTTP $http_code)"
              else
                echo "  Request $i: FAILED (HTTP $http_code)"
              fi
            done
            
            if [ $successful_requests -gt 0 ]; then
              avg_time=$((total_response_time / successful_requests))
              success_rate=$((successful_requests * 100 / 5))
              echo "  📊 $endpoint - Avg: ${avg_time}ms, Min: ${min_response_time}ms, Max: ${max_response_time}ms"
              echo "  📈 Success rate: $success_rate% ($successful_requests/5)"
              
              # Оценка производительности
              if [ "$avg_time" -lt 100 ]; then
                echo "  ✅ PERFORMANCE: EXCELLENT"
              elif [ "$avg_time" -lt 500 ]; then
                echo "  ⚠️  PERFORMANCE: ACCEPTABLE"
              else
                echo "  ❌ PERFORMANCE: POOR"
              fi
            else
              echo "  💥 $endpoint: All requests failed"
            fi
            echo ""
          done

      - name: Load testing and capacity check
        run: |
          echo " "
          echo "🔄 LOAD TESTING AND CAPACITY CHECK"
          echo "=================================="

          echo "Testing application under load (10 concurrent requests):"
          start_time=$(date +%s)

          # Запускаем 10 фоновых запросов
          for i in {1..10}; do
            (curl -s --connect-timeout 10 "http://localhost:3000/" > "/dev/null" && echo "  Request $i: SUCCESS") &
          done

          # Ждем завершения и считаем время
          wait
          end_time=$(date +%s)
          load_time=$((end_time - start_time))

          echo "  ⏱️  Total time for 10 concurrent requests: ${load_time}s"

          # Оценка способности выдерживать нагрузку
          if [ "$load_time" -lt 5 ]; then
            echo "  ✅ LOAD CAPACITY: EXCELLENT"
          elif [ "$load_time" -lt 10 ]; then
            echo "  ⚠️  LOAD CAPACITY: ACCEPTABLE"
          else
            echo "  ❌ LOAD CAPACITY: POOR - Application struggles under load"
          fi

      - name: Generate comprehensive monitoring report
        run: |
          echo " "
          echo "📋 COMPREHENSIVE MONITORING REPORT"
          echo "=================================="
          echo "Monitoring completed: $(date)"
          echo "System: $(uname -s) $(uname -m)"
          echo " "

          # Собираем ключевые метрики для итогового отчета
          node_processes=$(ps aux | grep -c "[n]ode" || echo "0")
          port_open=$(lsof -i :3000 > /dev/null 2>&1 && echo "YES" || echo "NO")

          # Подсчет ошибок из предыдущего шага
          total_errors=0
          for log_file in $(find . -name "*.log" -type f 2>/dev/null); do
            errors_in_file=$(grep -c -i "error\|fatal\|exception" "$log_file" 2>/dev/null || echo "0")
            total_errors=$((total_errors + errors_in_file))
          done

          echo "KEY PERFORMANCE INDICATORS:"
          echo "==========================="
          echo "📊 Application Processes: $node_processes"
          echo "🌐 Port 3000 Accessible: $port_open"
          echo "❌ Total Errors in Logs: $total_errors"
          echo "💾 Disk Free: $(df -h . | awk 'NR==2 {print $4}')"
          echo "💻 Load Average: $(uptime | awk -F'load average:' '{print $2}' | cut -d',' -f1 | xargs)"
          echo " "

          # Итоговая оценка состояния системы
          if [ "$node_processes" -eq 0 ]; then
            echo "❌ OVERALL STATUS: CRITICAL - No application processes"
            echo "💡 Recommendation: Check deployment and application startup"
            exit 1
          elif [ "$port_open" = "NO" ]; then
            echo "❌ OVERALL STATUS: CRITICAL - Application not accessible on port 3000"
            echo "💡 Recommendation: Verify application configuration and port binding"
            exit 1
          elif [ "$total_errors" -gt 10 ]; then
            echo "⚠️  OVERALL STATUS: DEGRADED - High error count"
            echo "💡 Recommendation: Investigate application errors in logs"
          else
            echo "✅ OVERALL STATUS: HEALTHY"
            echo "All key indicators within acceptable ranges"
          fi

          echo " "
          echo "RECOMMENDATIONS:"
          echo "1. Check application logs for detailed error information"
          echo "2. Monitor system resources regularly"
          echo "3. Verify application configuration"
          echo "4. Consider implementing application health checks"
  # Этап 5: Откат
  rollback:
    runs-on: self-hosted
    name: Rollback Deployment
    environment: production
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Stop current production
        run: |
          echo "Stopping current production deployment..."
          pkill -f "node.*server.js" || true
          sleep 5
          echo "✅ Current production stopped"

      - name: Checkout previous stable version
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.rollback_commit || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install dependencies
        run: npm ci

      - name: Deploy previous version
        run: |
          export PORT=3000
          export NODE_ENV=production
          export DB_STORAGE=./production.sqlite
          nohup npm start > rollback.log 2>&1 &
          echo $! > rollback.pid
          echo "🔄 Rollback deployment started"
          sleep 20

      - name: Verify rollback
        run: |
          echo "Verifying rollback..."
          counter=1
          while [ $counter -le 10 ]; do
            if curl -f http://localhost:3000/health > /dev/null 2>&1; then
              echo "✅ Rollback successful!"
              break
            fi
            echo "Attempt $counter/10 - Rollback not ready yet..."
            counter=$((counter + 1))
            sleep 3
          done

          if [ $counter -gt 10 ]; then
            echo "❌ Rollback failed"
            exit 1
          fi

          curl -f http://localhost:3000/health
          echo "Rollback to commit: ${{ github.event.inputs.rollback_commit || 'main' }}"

      - name: Log rollback info
        run: |
          echo "🔄 ROLLBACK COMPLETED"
          echo "📍 Rollback to: ${{ github.event.inputs.rollback_commit || 'main' }}"
          echo "🕒 Rollback time: $(date)"
          echo "📝 Current commit: $(git rev-parse HEAD)"
