name: Full CI/CD Pipeline with Docker Compose

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_commit:
        description: "Commit hash to rollback to"
        required: false
        type: string
        default: "main"

env:
  NODE_ENV: test

jobs:
  unit-tests:
    runs-on: self-hosted
    name: Unit Tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Save current state before unit tests
        id: backup_unit
        run: |
          echo "💾 Saving current commit for unit tests..."
          CURRENT_COMMIT=$(git rev-parse HEAD)
          echo "current_commit=$CURRENT_COMMIT" >> $GITHUB_OUTPUT
          echo "Unit tests starting for commit: $CURRENT_COMMIT"

      - name: Stop all services before tests
        run: |
          echo "🛑 Stopping all services..."
          # Остановка PM2 процессов если есть
          pm2 delete all 2>/dev/null || echo "No PM2 processes"
          # Остановка процессов на всех портах
          lsof -ti:3000 | xargs kill -9 2>/dev/null || echo "No process on port 3000"
          lsof -ti:8080 | xargs kill -9 2>/dev/null || echo "No process on port 8080"
          lsof -ti:8080 | xargs kill -9 2>/dev/null || echo "No process on port 8080"
          # Остановка всех Docker Compose контейнеров
          docker-compose down -v --remove-orphans 2>/dev/null || true
          docker-compose -f docker-compose.prod.yml down -v --remove-orphans 2>/dev/null || true
          echo "✅ All services stopped"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        id: run_unit_tests
        continue-on-error: true
        run: |
          # Используйте in-memory базу для unit-тестов
          NODE_ENV=test DB_DIALECT=sqlite npm run test:unit
        env:
          NODE_ENV: test
          DB_DIALECT: sqlite

      - name: Rollback on unit test failure
        if: steps.run_unit_tests.outcome == 'failure'
        run: |
          echo "🚨 Unit tests failed - attempting to restore previous state"
          echo "⚠️ Failed at commit: ${{ steps.backup_unit.outputs.current_commit }}"

          # Получаем предыдущий успешный коммит
          PREVIOUS_COMMIT=$(cat /tmp/last_successful_unit_test.txt 2>/dev/null || echo "HEAD~1")
          echo "🔄 Would rollback to: $PREVIOUS_COMMIT"
          echo "📝 Note: In real scenario, this would prevent merge to main"

          # Очистка
          pm2 delete all 2>/dev/null || echo "No PM2 processes"
          lsof -ti:3000 | xargs kill -9 2>/dev/null || echo "No process on port 3000"
          lsof -ti:8080 | xargs kill -9 2>/dev/null || echo "No process on port 8080"

          exit 1  # Останавливаем pipeline

      - name: Mark unit tests as successful
        if: steps.run_unit_tests.outcome == 'success'
        run: |
          echo "✅ Unit tests passed - updating marker"
          CURRENT_COMMIT=$(git rev-parse HEAD)
          echo "$CURRENT_COMMIT" > /tmp/last_successful_unit_test.txt
          echo "Successful unit test: $CURRENT_COMMIT"

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage/

      - name: Cleanup on test failure
        if: failure()
        run: |
          echo "❌ Unit tests failed - ensuring clean state..."
          pm2 delete all 2>/dev/null || echo "No PM2 processes"
          lsof -ti:3000 | xargs kill -9 2>/dev/null || echo "No process on port 3000"
          lsof -ti:8080 | xargs kill -9 2>/dev/null || echo "No process on port 8080"
          docker-compose down 2>/dev/null || true
          docker-compose -f docker-compose.prod.yml down 2>/dev/null || true
          echo "✅ All services stopped"

  deploy-test-environment:
    runs-on: self-hosted
    needs: unit-tests
    if: success()
    name: Deploy Test Environment
    environment: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Save test environment state
        id: backup_test_env
        run: |
          echo "💾 Saving state before test environment deployment..."
          CURRENT_COMMIT=$(git rev-parse HEAD)
          echo "current_commit=$CURRENT_COMMIT" >> $GITHUB_OUTPUT
          # Сохраняем текущее состояние PM2 если есть
          pm2 save --force 2>/dev/null || echo "No PM2 state"
          echo "Test environment deployment starting: $CURRENT_COMMIT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install dependencies
        run: npm ci

      - name: Start test application with PM2
        id: start_test_app
        continue-on-error: true
        run: |
          echo "🚀 Starting test environment on port 8080..."
          pm2 delete test-env 2>/dev/null || true
          PORT=8080 NODE_ENV=test DB_DIALECT=sqlite pm2 start server.js --name "test-env"
          sleep 5
          echo "✅ Test environment started"

      - name: Verify application is ready
        id: verify_test_app
        continue-on-error: true
        run: |
          echo "⏳ Waiting for application on port 8080..."
          MAX_ATTEMPTS=15
          ATTEMPT=1
          until curl -s -f http://127.0.0.1:8080/health > /dev/null; do
            if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
              echo "❌ Application failed to start"
              pm2 logs test-env --lines 50
              exit 1
            fi
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS..."
            ATTEMPT=$((ATTEMPT + 1))
            sleep 2
          done
          echo "✅ Test environment is ready on port 8080"

      - name: Verify application status
        id: verify_test_status
        continue-on-error: true
        run: |
          echo "🔍 Verifying application status..."
          curl -f http://127.0.0.1:8080/health
          echo "✅ Health check passed"
          curl -f http://127.0.0.1:8080/
          echo "✅ Root endpoint working"
          echo "🎉 Test environment is ready for integration tests"

      - name: Rollback test environment on failure
        if: |
          failure() && 
          (steps.start_test_app.outcome == 'failure' || 
           steps.verify_test_app.outcome == 'failure' || 
           steps.verify_test_status.outcome == 'failure')
        run: |
          echo "🚨 Test environment deployment failed - initiating rollback!"
          echo "⚠️ Failed step: start=${{ steps.start_test_app.outcome }}, verify=${{ steps.verify_test_app.outcome }}, status=${{ steps.verify_test_status.outcome }}"

          # Остановка проблемного деплоя
          echo "🛑 Stopping failed test deployment..."
          pm2 delete test-env 2>/dev/null || true
          lsof -ti:8080 | xargs kill -9 2>/dev/null || echo "No process on port 8080"

          # Получаем предыдущую версию
          PREVIOUS_COMMIT=$(cat /tmp/last_successful_test_deploy.txt 2>/dev/null || echo "HEAD~1")
          echo "🔄 Rolling back test environment to: $PREVIOUS_COMMIT"

          # Откат кода
          git fetch --all
          git checkout $PREVIOUS_COMMIT

          # Переустановка зависимостей
          echo "📦 Reinstalling dependencies..."
          npm ci

          # Запуск предыдущей версии
          echo "🚀 Starting previous test environment version..."
          PORT=8080 NODE_ENV=test DB_DIALECT=sqlite pm2 start server.js --name "test-env"
          sleep 8

          # Проверка отката
          echo "🔍 Verifying test environment rollback..."
          MAX_ATTEMPTS=10
          ATTEMPT=1

          until curl -s -f http://127.0.0.1:8080/health > /dev/null; do
            if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
              echo "❌ TEST ENVIRONMENT ROLLBACK FAILED!"
              pm2 logs test-env --lines 100
              exit 1
            fi
            echo "Rollback verification $ATTEMPT/$MAX_ATTEMPTS..."
            ATTEMPT=$((ATTEMPT + 1))
            sleep 3
          done

          echo "✅ TEST ENVIRONMENT ROLLBACK SUCCESSFUL"
          echo "📍 Running at: http://127.0.0.1:8080"
          echo "📝 Rolled back to: $PREVIOUS_COMMIT"

          exit 1  # Помечаем деплой как неуспешный

      - name: Update test environment success marker
        if: |
          steps.start_test_app.outcome == 'success' && 
          steps.verify_test_app.outcome == 'success' && 
          steps.verify_test_status.outcome == 'success'
        run: |
          echo "✅ Test environment deployed successfully"
          CURRENT_COMMIT=$(git rev-parse HEAD)
          echo "$CURRENT_COMMIT" > /tmp/last_successful_test_deploy.txt
          echo "Successful test deploy: $CURRENT_COMMIT"

  integration-tests:
    runs-on: self-hosted
    needs: deploy-test-environment
    if: success()
    name: Integration Tests
    environment: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install dependencies
        run: npm ci

      - name: Download unit test coverage
        uses: actions/download-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage/

      - name: Verify application is still running
        run: |
          echo "🔍 Checking if application is still running..."
          if curl -s -f http://127.0.0.1:8080/health > /dev/null; then
            echo "✅ Application is running and ready for tests"
          else
            echo "❌ Application is not running. Restarting..."
            pm2 restart test-env
            sleep 10
            curl -f http://127.0.0.1:8080/health
          fi

      - name: Run integration tests against Docker environment
        id: run_integration_tests
        continue-on-error: true
        env:
          NODE_ENV: test
          TEST_BASE_URL: http://127.0.0.1:8080
        run: |
          echo "Using TEST_BASE_URL=$TEST_BASE_URL"
          npm run test:integration

      - name: Rollback on integration test failure
        if: steps.run_integration_tests.outcome == 'failure'
        run: |
          echo "🚨 Integration tests failed!"
          echo "⚠️ This indicates test environment issues"

          # Логирование для анализа
          echo "📊 Getting application logs..."
          pm2 logs test-env --lines 100 --nostream || true

          echo "🔍 Checking application health..."
          curl -s http://127.0.0.1:8080/health || echo "Health check failed"

          PREVIOUS_COMMIT=$(cat /tmp/last_successful_integration_test.txt 2>/dev/null || echo "HEAD~1")
          echo "💡 Last successful integration test was at: $PREVIOUS_COMMIT"
          echo "📝 Current commit failed integration tests - pipeline stopped"

          exit 1  # Останавливаем pipeline

      - name: Mark integration tests as successful
        if: steps.run_integration_tests.outcome == 'success'
        run: |
          echo "✅ Integration tests passed"
          CURRENT_COMMIT=$(git rev-parse HEAD)
          echo "$CURRENT_COMMIT" > /tmp/last_successful_integration_test.txt
          echo "Successful integration test: $CURRENT_COMMIT"

      - name: Test API endpoints manually
        run: |
          echo "🧪 Testing API endpoints manually..."

          # Test health endpoint
          echo "🔍 Testing health endpoint..."
          curl -f http://127.0.0.1:8080/health
          echo "✅ Health endpoint works"

          # Test public endpoint
          echo "🔍 Testing public endpoint..."
          curl -f http://127.0.0.1:8080/api/test/all
          echo "✅ Public endpoint works"

          # Test registration
          echo "🔍 Testing user registration..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://127.0.0.1:8080/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"username":"githubactionstest","email":"github@example.com","password":"password123"}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n1)

          echo "Registration response code: $HTTP_CODE"
          echo "Registration response body: $BODY"

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ User registration test passed"
          else
            echo "⚠️ User registration returned $HTTP_CODE (might be expected if user exists)"
          fi

          echo "✅ Manual API tests completed"

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            test-results/
            coverage/
          retention-days: 7

      - name: Run basic API tests
        env:
          NODE_ENV: test
          TEST_BASE_URL: http://127.0.0.1:8080
        run: |
          echo "Running basic API tests..."
          npm run test:integration:basic

      - name: Debug API responses
        run: |
          echo "🔍 Debugging API responses..."
          echo "Health endpoint:"
          curl -s http://127.0.0.1:8080/health | jq . || curl -s http://127.0.0.1:8080/health
          echo ""
          echo "Public endpoint:"
          curl -s http://127.0.0.1:8080/api/test/all | jq . || curl -s http://127.0.0.1:8080/api/test/all
          echo ""
          echo "Testing registration:"
          curl -s -X POST http://127.0.0.1:8080/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"username":"debuguser","email":"debug@example.com","password":"password123"}' | jq . || \
          curl -s -X POST http://127.0.0.1:8080/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"username":"debuguser","email":"debug@example.com","password":"password123"}'

      - name: Keep test environment running
        if: always()
        run: |
          echo "ℹ️ Test environment on port 8080 will remain running"
          echo "Access it at: http://127.0.0.1:8080"
          echo "Health check: http://127.0.0.1:8080/health"

  deploy-production:
    runs-on: self-hosted
    needs: integration-tests
    environment: production
    name: Deploy to Production
    if: success() && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install dependencies
        run: npm ci

      - name: Save current deployment state (backup)
        id: backup
        run: |
          echo "💾 Saving current deployment state..."
          # Сохраняем текущий коммит
          CURRENT_COMMIT=$(git rev-parse HEAD)
          echo "current_commit=$CURRENT_COMMIT" >> $GITHUB_OUTPUT

          # Сохраняем состояние PM2
          pm2 save --force 2>/dev/null || echo "No PM2 state to save"

          # Сохраняем информацию о предыдущем деплое
          echo "$CURRENT_COMMIT" > /tmp/last_successful_deploy.txt
          echo "✅ Backup created: commit $CURRENT_COMMIT"

      - name: Start production application with PM2
        id: deploy
        run: |
          echo "🚀 Starting production environment on port 3000..."
          pm2 delete production-env 2>/dev/null || true
          PORT=3000 NODE_ENV=production DB_DIALECT=sqlite pm2 start server.js --name "production-env"
          sleep 5
          echo "✅ Production started"

      - name: Wait for production application
        id: health_check
        continue-on-error: true
        run: |
          echo "⏳ Waiting for production application..."
          MAX_ATTEMPTS=15
          ATTEMPT=1

          until curl -s -f http://127.0.0.1:3000/health > /dev/null; do
            if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
              echo "❌ Production application failed to start"
              pm2 logs production-env --lines 50
              exit 1
            fi
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS - Application not ready..."
            ATTEMPT=$((ATTEMPT + 1))
            sleep 2
          done
          echo "✅ Production application is healthy"

      - name: Verify production deployment
        id: verify_deployment
        continue-on-error: true
        run: |
          echo "🔍 Verifying production deployment..."

          # Проверка health endpoint
          if ! curl -f http://127.0.0.1:3000/health; then
            echo "❌ Health check failed"
            exit 1
          fi
          echo "✅ Health check passed"

          # Проверка статуса БД
          DB_STATUS=$(curl -s http://127.0.0.1:3000/health | grep -o '"status":"[^"]*"')
          echo "📊 Database status: $DB_STATUS"

          # Проверка основных эндпоинтов
          if ! curl -f http://127.0.0.1:3000/api/test/all > /dev/null 2>&1; then
            echo "❌ Public API endpoint check failed"
            exit 1
          fi
          echo "✅ Public API endpoint works"

      - name: Test production functionality
        id: functional_tests
        continue-on-error: true
        run: |
          echo "🧪 Testing production functionality..."
          echo "🔍 Testing user registration..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://127.0.0.1:3000/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"username":"productionuser","email":"production@example.com","password":"password123"}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n1)

          echo "Registration response code: $HTTP_CODE"
          echo "Registration response body: $BODY"

          if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 400 ]; then
            echo "✅ Production registration test passed (user may exist)"
          else
            echo "❌ Production registration test failed with code $HTTP_CODE"
            exit 1
          fi

      - name: Automatic Rollback on Critical Failure
        if: |
          failure() && 
          (steps.health_check.outcome == 'failure' || 
           steps.verify_deployment.outcome == 'failure' || 
           steps.functional_tests.outcome == 'failure')
        run: |
          echo "🚨 CRITICAL FAILURE DETECTED - Initiating automatic rollback!"
          echo "⚠️ Failed step: health_check=${{ steps.health_check.outcome }}, verify=${{ steps.verify_deployment.outcome }}, functional=${{ steps.functional_tests.outcome }}"

          # Остановка текущего (проблемного) деплоя
          echo "🛑 Stopping failed deployment..."
          pm2 delete production-env 2>/dev/null || true

          # Получаем предыдущий успешный коммит
          PREVIOUS_COMMIT=$(cat /tmp/last_successful_deploy.txt 2>/dev/null || echo "HEAD~1")
          echo "🔄 Rolling back to previous commit: $PREVIOUS_COMMIT"

          # Откатываем код
          git fetch --all
          git checkout $PREVIOUS_COMMIT

          # Переустанавливаем зависимости (на случай если они изменились)
          echo "📦 Reinstalling dependencies from previous version..."
          npm ci

          # Запускаем предыдущую версию
          echo "🚀 Starting previous version..."
          PORT=3000 NODE_ENV=production DB_DIALECT=sqlite pm2 start server.js --name "production-env"
          sleep 8

          # Проверяем что откат прошел успешно
          echo "🔍 Verifying rollback..."
          MAX_ATTEMPTS=10
          ATTEMPT=1

          until curl -s -f http://127.0.0.1:3000/health > /dev/null; do
            if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
              echo "❌ ROLLBACK FAILED - Manual intervention required!"
              pm2 logs production-env --lines 100
              exit 1
            fi
            echo "Rollback verification attempt $ATTEMPT/$MAX_ATTEMPTS..."
            ATTEMPT=$((ATTEMPT + 1))
            sleep 3
          done

          echo "✅ ROLLBACK SUCCESSFUL - Previous version restored"
          echo "📍 Application running at: http://127.0.0.1:3000"
          echo "🏥 Health check: http://127.0.0.1:3000/health"
          echo "📝 Rolled back to commit: $PREVIOUS_COMMIT"

          # Уведомление об откате
          curl -f http://127.0.0.1:3000/health

          exit 1  # Помечаем деплой как неуспешный, но приложение работает

      - name: Update successful deployment marker
        if: success()
        run: |
          echo "✅ Deployment successful - updating marker"
          CURRENT_COMMIT=$(git rev-parse HEAD)
          echo "$CURRENT_COMMIT" > /tmp/last_successful_deploy.txt
          echo "Successful deployment: $CURRENT_COMMIT"

      - name: Log deployment info
        run: |
          echo "🎉 PRODUCTION DEPLOYMENT SUCCESSFUL"
          echo "📍 URL: http://127.0.0.1:3000"
          echo "🏥 Health: http://127.0.0.1:3000/health"
          echo "📊 Environment: production"
          echo "🔧 Node: $(node --version)"
          echo "🕒 Deployed at: $(date)"
          echo "📝 Commit: ${{ github.sha }}"

  rollback:
    runs-on: self-hosted
    name: Rollback Deployment
    environment: production
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout previous version
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.rollback_commit || 'main' }}

      - name: Rollback with Docker Compose
        run: |
          docker-compose down
          docker-compose up -d --build
          echo "🔄 Rollback deployment started"

      - name: Verify rollback
        run: |
          echo "Verifying rollback..."
          counter=1
          while [ $counter -le 10 ]; do
            if curl -f http://localhost:8080/health > /dev/null 2>&1; then
              echo "✅ Rollback successful!"
              break
            fi
            echo "Attempt $counter/10 - Rollback not ready yet..."
            counter=$((counter + 1))
            sleep 3
          done

          if [ $counter -gt 10 ]; then
            echo "❌ Rollback failed"
            exit 1
          fi

          curl -f http://localhost:8080/health
          echo "Rollback to commit: ${{ github.event.inputs.rollback_commit || 'main' }}"
