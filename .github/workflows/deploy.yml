name: Full CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_ENV: test
  DB_DIALECT: sqlite

jobs:
  # Этап 1: Сборка и тестирование (ЕДИНСТВЕННЫЙ раз устанавливаем зависимости)
  build-and-test:
    runs-on: self-hosted
    name: Build and Test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (ТОЛЬКО ЗДЕСЬ для всего пайплайна)
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --production --audit-level=high

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Create deployment package
        run: |
          # Создаем полный пакет для деплоя
          tar -czf deployment.tar.gz \
            ./*.js \
            ./app/ \
            ./config/ \
            ./tests/ \
            ./node_modules/ \
            ./package.json \
            ./package-lock.json
          echo "📦 Deployment package created"

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: deployment.tar.gz
          retention-days: 1

  # Этап 2: Деплой на staging
  deploy-staging:
    runs-on: self-hosted
    needs: build-and-test
    environment: staging
    name: Deploy to Staging

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Extract and setup
        run: |
          # Распаковываем готовый пакет
          tar -xzf deployment.tar.gz
          echo "📦 Deployment package extracted"

      - name: Deploy to staging
        run: |
          export PORT=3001
          export NODE_ENV=staging
          export DB_STORAGE=./staging.sqlite
          npm start &
          echo "🚀 Staging deployment started on port 3001"
          sleep 15

      - name: Verify staging deployment
        run: |
          echo "Verifying staging deployment..."
          counter=1
          while [ $counter -le 10 ]; do
            if curl -f http://localhost:3001/health > /dev/null 2>&1; then
              echo "✅ Staging application is ready!"
              break
            fi
            echo "Attempt $counter/10 - Staging not ready yet..."
            counter=$((counter + 1))
            sleep 3
          done

          if [ $counter -gt 10 ]; then
            echo "❌ Staging failed to start"
            exit 1
          fi

          # Тестируем основные endpoints
          curl -f http://localhost:3001/health
          echo ""
          curl -f http://localhost:3001/
          echo ""

      - name: Run staging smoke tests
        run: |
          echo "Running staging smoke tests..."
          curl -X POST http://localhost:3001/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"username":"staginguser","email":"staging@example.com","password":"password123"}' \
            -w "\nHTTP Status: %{http_code}\n" || echo "Staging user creation test completed"

  # Этап 3: Деплой в production
  deploy-production:
    runs-on: self-hosted
    needs: deploy-staging
    environment: production
    name: Deploy to Production
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Extract and setup
        run: |
          tar -xzf deployment.tar.gz
          echo "📦 Production deployment package extracted"

      - name: Stop previous production
        run: |
          # Аккуратно останавливаем предыдущую версию
          pkill -f "node.*server.js" || true
          sleep 5
          echo "✅ Previous production instance stopped"

      - name: Deploy to production
        run: |
          export PORT=3000
          export NODE_ENV=production
          export DB_STORAGE=./production.sqlite
          nohup npm start > production.log 2>&1 &
          echo $! > app.pid
          echo "🚀 Production deployment started on port 3000"
          sleep 20

      - name: Verify production deployment
        run: |
          echo "Verifying production deployment..."
          counter=1
          while [ $counter -le 10 ]; do
            if curl -f http://localhost:3000/health > /dev/null 2>&1; then
              echo "✅ Production application is ready!"
              break
            fi
            echo "Attempt $counter/10 - Production not ready yet..."
            counter=$((counter + 1))
            sleep 3
          done

          if [ $counter -gt 10 ]; then
            echo "❌ Production failed to start"
            echo "=== Production logs ==="
            cat production.log || echo "No logs available"
            exit 1
          fi

          # Комплексная проверка
          echo "=== Production Health Check ==="
          curl -f http://localhost:3000/health
          echo ""
          echo "=== Production API ==="
          curl -f http://localhost:3000/
          echo ""

      - name: Run production smoke tests
        run: |
          echo "Running production smoke tests..."
          curl -X POST http://localhost:3000/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"username":"productionuser","email":"production@example.com","password":"password123"}' \
            -w "\nHTTP Status: %{http_code}\n" || echo "Production user creation test completed"

      - name: Log deployment success
        run: |
          echo "🎉 PRODUCTION DEPLOYMENT SUCCESSFUL"
          echo "📍 URL: http://localhost:3000"
          echo "🏥 Health: http://localhost:3000/health"
          echo "📊 Metrics: http://localhost:3000/metrics"
          echo "🌍 Environment: production"
          echo "🕒 Deployed at: $(date)"
          echo "📝 Commit: ${{ github.sha }}"

  # Этап 4: Мониторинг
  monitoring:
    runs-on: self-hosted
    needs: deploy-production
    name: Monitoring & Health Checks
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Health check monitoring
        run: |
          echo "Starting health check monitoring..."
          i=1
          while [ $i -le 5 ]; do
            echo ""
            echo "=== Health check $i ==="
            
            response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" http://localhost:3000/health 2>/dev/null || echo "HTTP_STATUS:000")
            status=$(echo "$response" | grep "HTTP_STATUS" | cut -d':' -f2)
            body=$(echo "$response" | grep -v "HTTP_STATUS")
            
            echo "Status: $status"
            if [ "$status" = "200" ]; then
              echo "✅ Health check $i: PASSED"
              echo "Response: $body"
            else
              echo "❌ Health check $i: FAILED (Status: $status)"
            fi
            
            echo "Waiting 30 seconds until next check..."
            i=$((i + 1))
            sleep 30
          done
          echo "📊 Monitoring completed successfully"

      - name: Performance check
        run: |
          echo "Running performance checks..."
          echo "Health endpoint response time:"
          time curl -s -o /dev/null http://localhost:3000/health
          echo "Main endpoint response time:"
          time curl -s -o /dev/null http://localhost:3000/

      - name: Final status report
        run: |
          echo "=== FINAL DEPLOYMENT STATUS ==="
          if curl -f http://localhost:3000/health > /dev/null 2>&1; then
            echo "🎉 STATUS: HEALTHY"
            echo "📍 Application is running successfully"
            echo "📈 All health checks passed"
            echo "🚀 Deployment completed successfully"
          else
            echo "❌ STATUS: UNHEALTHY"
            echo "⚠️  Application may have issues"
            exit 1
          fi

  # Этап 5: Откат (ручной запуск)
  rollback:
    runs-on: self-hosted
    name: Rollback Deployment
    environment: production
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout specific commit for rollback
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.rollback_commit || 'main' }}

      - name: Setup Node.js for rollback
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install dependencies for rollback
        run: npm ci

      - name: Stop current production
        run: |
          echo "Stopping current production deployment..."
          pkill -f "node.*server.js" || true
          sleep 5
          echo "✅ Current production stopped"

      - name: Deploy previous version
        run: |
          export PORT=3000
          export NODE_ENV=production
          export DB_STORAGE=./production.sqlite
          nohup npm start > rollback.log 2>&1 &
          echo $! > rollback.pid
          echo "🔄 Rollback deployment started"
          sleep 20

      - name: Verify rollback
        run: |
          echo "Verifying rollback..."
          counter=1
          while [ $counter -le 10 ]; do
            if curl -f http://localhost:3000/health > /dev/null 2>&1; then
              echo "✅ Rollback successful!"
              break
            fi
            echo "Attempt $counter/10 - Rollback not ready yet..."
            counter=$((counter + 1))
            sleep 3
          done

          curl -f http://localhost:3000/health
          echo "Rollback to commit: ${{ github.event.inputs.rollback_commit || 'main' }}"

      - name: Log rollback info
        run: |
          echo "🔄 ROLLBACK COMPLETED SUCCESSFULLY"
          echo "📍 Rollback to: ${{ github.event.inputs.rollback_commit || 'main' }}"
          echo "🕒 Rollback time: $(date)"
          echo "📝 Current commit: $(git rev-parse HEAD)"
