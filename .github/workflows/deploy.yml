name: Deploy to Self-Hosted Runner

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install and start PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE USER test_admin WITH PASSWORD 'test_1234';"
          sudo -u postgres psql -c "CREATE DATABASE test_lab4db OWNER test_admin;"
          sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE test_lab4db TO test_admin;"

      - name: Install dependencies
        run: npm install

      - name: Wait for PostgreSQL
        run: |
          sudo apt-get install -y postgresql-client
          timeout 60s bash -c 'until pg_isready -h localhost -p 5432; do sleep 2; done'

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

  deploy:
    needs: test
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install and start PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE USER test_admin WITH PASSWORD 'test_1234';" || true
          sudo -u postgres psql -c "CREATE DATABASE test_lab4db OWNER test_admin;" || true

      - name: Install dependencies
        run: npm install

      - name: Wait for PostgreSQL
        run: |
          sudo apt-get install -y postgresql-client
          timeout 60s bash -c 'until pg_isready -h localhost -p 5432; do sleep 2; done'

      - name: Start application
        run: |
          npm start &
          echo "Application starting in background..."
          sleep 15

      - name: Test application
        run: |
          timeout 60s bash -c 'until curl -f http://localhost:8080/health; do sleep 2; done'
          echo "✅ Application is ready!"
          curl http://localhost:8080/health
          curl http://localhost:8080/

      - name: Keep application running
        run: |
          echo "🚀 Application running on Self-Hosted Runner"
          echo "📍 URL: http://$(hostname):8080"
          echo "⏰ Running for 5 minutes..."
          sleep 300
