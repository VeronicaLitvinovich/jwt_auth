name: Full CI/CD Pipeline with Docker Compose

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_commit:
        description: "Commit hash to rollback to"
        required: false
        type: string
        default: "main"

env:
  NODE_ENV: test

jobs:
  # Этап 1: Юнит-тесты
  unit-tests:
    runs-on: self-hosted
    name: 🧪 Unit Tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Stop all services before tests
        run: |
          echo "🛑 Stopping all services..."
          # Остановка PM2 процессов если есть
          pm2 delete all 2>/dev/null || echo "No PM2 processes"
          # Остановка процессов на всех портах
          lsof -ti:3000 | xargs kill -9 2>/dev/null || echo "No process on port 3000"
          lsof -ti:8080 | xargs kill -9 2>/dev/null || echo "No process on port 8080"
          lsof -ti:8081 | xargs kill -9 2>/dev/null || echo "No process on port 8081"
          # Остановка всех Docker Compose контейнеров
          docker-compose down -v --remove-orphans 2>/dev/null || true
          docker-compose -f docker-compose.prod.yml down -v --remove-orphans 2>/dev/null || true
          echo "✅ All services stopped"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: |
          # Используйте in-memory базу для unit-тестов
          NODE_ENV=test DB_DIALECT=sqlite npm run test:unit
        env:
          NODE_ENV: test
          DB_DIALECT: sqlite

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage/

      - name: Cleanup on test failure
        if: failure()
        run: |
          echo "❌ Unit tests failed - ensuring clean state..."
          pm2 delete all 2>/dev/null || echo "No PM2 processes"
          lsof -ti:3000 | xargs kill -9 2>/dev/null || echo "No process on port 3000"
          lsof -ti:8081 | xargs kill -9 2>/dev/null || echo "No process on port 8081"
          docker-compose down 2>/dev/null || true
          docker-compose -f docker-compose.prod.yml down 2>/dev/null || true
          echo "✅ All services stopped"

  # Этап 2: Запуск тестового окружения с Docker Compose
  deploy-test-environment:
    runs-on: self-hosted
    needs: unit-tests
    if: success() # Запускается только если unit-tests прошли успешно
    name: 🐳 Deploy Test Environment
    environment: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Docker if not running
        run: |
          if ! docker info > /dev/null 2>&1; then
            echo "🐳 Starting Docker..."
            open -a Docker
            # Ждем пока Docker запустится
            MAX_ATTEMPTS=30
            ATTEMPT=1
            until docker info > /dev/null 2>&1; do
              if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
                echo "❌ Docker failed to start"
                exit 1
              fi
              echo "Waiting for Docker... ($ATTEMPT/$MAX_ATTEMPTS)"
              ATTEMPT=$((ATTEMPT + 1))
              sleep 2
            done
            echo "✅ Docker is running"
          else
            echo "✅ Docker is already running"
          fi

      - name: Setup Docker Compose
        run: |
          docker-compose version
          echo "✅ Docker Compose available"

      - name: Stop any existing containers
        run: |
          docker-compose down -v --remove-orphans || true
          echo "✅ Cleaned previous containers"

      - name: Build and start services with Docker Compose
        run: |
          docker-compose up -d --build
          echo "✅ Services started with Docker Compose"

      - name: Wait for services to be ready
        run: |
          echo "⏳ Waiting for PostgreSQL and App to be ready..."
          MAX_ATTEMPTS=30
          ATTEMPT=1
          SUCCESS=false

          # Ждем PostgreSQL
          echo "🔍 Waiting for PostgreSQL..."
          until docker-compose exec -T db pg_isready -U test_admin > /dev/null 2>&1; do
            if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
              echo "❌ PostgreSQL failed to start within $((MAX_ATTEMPTS * 2)) seconds"
              docker-compose logs db
              exit 1
            fi
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS - PostgreSQL not ready..."
            ATTEMPT=$((ATTEMPT + 1))
            sleep 2
          done
          echo "✅ PostgreSQL is ready"

          # Ждем приложение
          ATTEMPT=1
          echo "🔍 Waiting for Application..."
          until curl -s -f http://localhost:8081/health > /dev/null; do
            if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
              echo "❌ Application failed to start within $((MAX_ATTEMPTS * 3)) seconds"
              docker-compose logs app
              exit 1
            fi
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS - Application not ready..."
            
            # Показываем логи на определенных попытках
            if [ $ATTEMPT -eq 10 ]; then
              echo "📋 Recent application logs:"
              docker-compose logs app --tail=20
            fi
            
            ATTEMPT=$((ATTEMPT + 1))
            sleep 3
          done
          echo "✅ Application is ready and healthy"

      - name: Verify application status
        run: |
          echo "🔍 Verifying application status..."
          curl -f http://localhost:8081/health
          echo "✅ Health check passed"
          curl -f http://localhost:8081/
          echo "✅ Root endpoint working"
          echo "🎉 Test environment is ready for integration tests"

  # Этап 3: Интеграционные тесты
  integration-tests:
    runs-on: self-hosted
    needs: deploy-test-environment
    if: success() # Запускается только если тестовое окружение развернулось
    name: 🔗 Integration Tests
    environment: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install dependencies
        run: npm ci

      - name: Download unit test coverage
        uses: actions/download-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage/

      - name: Verify application is still running
        run: |
          echo "🔍 Checking if application is still running..."
          if curl -s -f http://localhost:8081/health > /dev/null; then
            echo "✅ Application is running and ready for tests"
          else
            echo "❌ Application is not running. Restarting..."
            docker-compose up -d app
            sleep 10
            curl -f http://localhost:8081/health
          fi

      - name: Run integration tests against Docker environment
        env:
          NODE_ENV: test
          TEST_BASE_URL: http://localhost:8081
        run: |
          echo "Using TEST_BASE_URL=$TEST_BASE_URL"
          npm run test:integration

      - name: Test API endpoints manually
        run: |
          echo "🧪 Testing API endpoints manually..."

          # Test health endpoint
          echo "🔍 Testing health endpoint..."
          curl -f http://localhost:8081/health
          echo "✅ Health endpoint works"

          # Test public endpoint
          echo "🔍 Testing public endpoint..."
          curl -f http://localhost:8081/api/test/all
          echo "✅ Public endpoint works"

          # Test registration
          echo "🔍 Testing user registration..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://localhost:8081/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"username":"githubactionstest","email":"github@example.com","password":"password123"}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n1)

          echo "Registration response code: $HTTP_CODE"
          echo "Registration response body: $BODY"

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ User registration test passed"
          else
            echo "⚠️ User registration returned $HTTP_CODE (might be expected if user exists)"
          fi

          echo "✅ Manual API tests completed"

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            test-results/
            coverage/
          retention-days: 7

      - name: Run basic API tests
        env:
          NODE_ENV: test
          TEST_BASE_URL: http://localhost:8081
        run: |
          echo "Running basic API tests..."
          npm run test:integration:basic

      - name: Debug API responses
        run: |
          echo "🔍 Debugging API responses..."
          echo "Health endpoint:"
          curl -s http://localhost:8081/health | jq . || curl -s http://localhost:8081/health
          echo ""
          echo "Public endpoint:"
          curl -s http://localhost:8081/api/test/all | jq . || curl -s http://localhost:8081/api/test/all
          echo ""
          echo "Testing registration:"
          curl -s -X POST http://localhost:8081/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"username":"debuguser","email":"debug@example.com","password":"password123"}' | jq . || \
          curl -s -X POST http://localhost:8081/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"username":"debuguser","email":"debug@example.com","password":"password123"}'

  # Этап 4: Деплой в production
  deploy-production:
    runs-on: self-hosted
    needs: integration-tests
    environment: production
    name: 🚀 Deploy to Production
    # Запускается только если все интеграционные тесты прошли успешно и это main ветка
    if: success() && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Docker if not running
        run: |
          if ! docker info > /dev/null 2>&1; then
            echo "🐳 Starting Docker..."
            open -a Docker
            # Ждем пока Docker запустится
            MAX_ATTEMPTS=30
            ATTEMPT=1
            until docker info > /dev/null 2>&1; do
              if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
                echo "❌ Docker failed to start"
                exit 1
              fi
              echo "Waiting for Docker... ($ATTEMPT/$MAX_ATTEMPTS)"
              ATTEMPT=$((ATTEMPT + 1))
              sleep 2
            done
            echo "✅ Docker is running"
          else
            echo "✅ Docker is already running"
          fi

      - name: Setup Docker Compose
        run: |
          docker-compose version

      - name: Stop existing production containers
        run: |
          docker-compose -f docker-compose.prod.yml down || true
          echo "✅ Stopped existing production"

      - name: Build production images
        run: |
          docker-compose -f docker-compose.prod.yml build --no-cache
          echo "✅ Production images built"

      - name: Deploy to production
        run: |
          docker-compose -f docker-compose.prod.yml up -d
          echo "🚀 Production deployment started"

      - name: Wait for production database
        run: |
          echo "⏳ Waiting for production database..."
          MAX_ATTEMPTS=30
          ATTEMPT=1

          until docker-compose -f docker-compose.prod.yml exec -T db pg_isready -U test_admin > /dev/null 2>&1; do
            if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
              echo "❌ Production database failed to start"
              docker-compose -f docker-compose.prod.yml logs db
              exit 1
            fi
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS - Database not ready..."
            ATTEMPT=$((ATTEMPT + 1))
            sleep 3
          done
          echo "✅ Production database is ready"

      - name: Check production database roles
        run: |
          echo "🔍 Checking production database roles..."
          docker-compose -f docker-compose.prod.yml exec -T db psql -U test_admin -d test_lab4_1 -c "SELECT * FROM roles;" || echo "Cannot check roles table"

      - name: Wait for production application
        run: |
          echo "⏳ Waiting for production application..."
          MAX_ATTEMPTS=30
          ATTEMPT=1

          until curl -s -f http://localhost:3000/health > /dev/null; do
            if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
              echo "❌ Production application failed to start"
              docker-compose -f docker-compose.prod.yml logs app
              exit 1
            fi
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS - Application not ready..."
            ATTEMPT=$((ATTEMPT + 1))
            sleep 5
          done
          echo "✅ Production application is healthy"

      - name: Verify production deployment
        run: |
          echo "🔍 Verifying production deployment..."

          # Проверяем health endpoint
          curl -f http://localhost:3000/health
          echo "✅ Health check passed"

          # Проверяем что база данных подключена
          DB_STATUS=$(curl -s http://localhost:3000/health | grep -o '"status":"[^"]*"')
          echo "📊 Database status: $DB_STATUS"

          # Проверяем роли в базе данных
          echo "🔍 Checking database roles..."
          docker-compose -f docker-compose.prod.yml exec -T db psql -U test_admin -d test_lab4_1 -c "SELECT id, name FROM roles;" || echo "Cannot check roles"

      - name: Test production functionality
        run: |
          echo "🧪 Testing production functionality..."

          # Тестируем регистрацию
          echo "🔍 Testing user registration..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://localhost:3000/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"username":"productionuser","email":"production@example.com","password":"password123"}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n1)

          echo "Registration response code: $HTTP_CODE"
          echo "Registration response body: $BODY"

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Production registration test passed"
          else
            echo "⚠️ Production registration returned $HTTP_CODE"
          fi

      - name: Log deployment info
        run: |
          echo "🎉 PRODUCTION DEPLOYMENT SUCCESSFUL"
          echo "📍 URL: http://localhost:3000"
          echo "🏥 Health: http://localhost:3000/health"
          echo "📊 Environment: production"
          echo "🔧 Node: $(node --version)"
          echo "🕒 Deployed at: $(date)"
          echo "📝 Commit: ${{ github.sha }}"

  # Этап 5: Откат
  rollback:
    runs-on: self-hosted
    name: 🔄 Rollback Deployment
    environment: production
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout previous version
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.rollback_commit || 'main' }}

      - name: Rollback with Docker Compose
        run: |
          docker-compose down
          docker-compose up -d --build
          echo "🔄 Rollback deployment started"

      - name: Verify rollback
        run: |
          echo "Verifying rollback..."
          counter=1
          while [ $counter -le 10 ]; do
            if curl -f http://localhost:8081/health > /dev/null 2>&1; then
              echo "✅ Rollback successful!"
              break
            fi
            echo "Attempt $counter/10 - Rollback not ready yet..."
            counter=$((counter + 1))
            sleep 3
          done

          if [ $counter -gt 10 ]; then
            echo "❌ Rollback failed"
            exit 1
          fi

          curl -f http://localhost:8081/health
          echo "Rollback to commit: ${{ github.event.inputs.rollback_commit || 'main' }}"
