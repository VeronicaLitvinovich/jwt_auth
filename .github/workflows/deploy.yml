name: Full CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_ENV: test
  DB_DIALECT: sqlite

jobs:
  # Этап 1: Сборка и юнит-тесты
  build-and-unit-tests:
    runs-on: self-hosted
    name: Build and Unit Tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --production --audit-level=high

      - name: Run unit tests with coverage
        run: |
          npm run test:unit
        env:
          NODE_ENV: test

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage/
          retention-days: 7

  # Этап 2: Деплой на staging и интеграционные тесты
  deploy-staging-and-integration-tests:
    runs-on: self-hosted
    needs: build-and-unit-tests
    environment: staging
    name: Deploy to Staging & Integration Tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install dependencies
        run: npm ci

      - name: Download unit test coverage
        uses: actions/download-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage/

      - name: Deploy to staging environment
        run: |
          export PORT=3001
          export NODE_ENV=staging
          export DB_STORAGE=./staging.sqlite
          npm start &
          echo "🚀 Staging deployment started on port 3001"
          sleep 15

      - name: Wait for staging to be ready (macOS compatible)
        run: |
          echo "Waiting for staging application..."
          counter=1
          while [ $counter -le 10 ]; do
            if curl -f http://localhost:3001/health > /dev/null 2>&1; then
              echo "✅ Staging application is ready!"
              break
            fi
            echo "Attempt $counter/10 - Staging not ready yet..."
            counter=$((counter + 1))
            sleep 3
          done

          if [ $counter -gt 10 ]; then
            echo "❌ Staging failed to start"
            exit 1
          fi

      - name: Run integration tests against staging
        run: |
          export TEST_BASE_URL=http://localhost:3001
          npm run test:integration
        env:
          NODE_ENV: test

      - name: API smoke tests
        run: |
          echo "Running API smoke tests on staging..."

          # Health check
          curl -f http://localhost:3001/health
          echo "✅ Health check passed"

          # Main endpoint
          curl -f http://localhost:3001/
          echo "✅ Main endpoint passed"

          # Test authentication endpoints
          curl -X POST http://localhost:3001/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"username":"staginguser","email":"staging@example.com","password":"password123"}' \
            -w "\nHTTP Status: %{http_code}\n" || echo "User creation test completed"

          echo "✅ Staging environment verified"

      - name: Upload staging test results
        uses: actions/upload-artifact@v4
        with:
          name: staging-test-results
          path: |
            test-results/
            coverage/
          retention-days: 7

  # Этап 3: Деплой в production
  deploy-production:
    runs-on: self-hosted
    needs: deploy-staging-and-integration-tests
    environment: production
    name: Deploy to Production
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install dependencies
        run: npm ci

      - name: Stop previous production instance
        run: |
          # Останавливаем предыдущую версию приложения
          pkill -f "node.*server.js" || true
          sleep 3
          echo "✅ Previous instance stopped"

      - name: Deploy to production
        run: |
          export PORT=3000
          export NODE_ENV=production
          export DB_STORAGE=./production.sqlite
          nohup npm start > production.log 2>&1 &
          echo $! > app.pid
          echo "🚀 Production deployment started on port 3000"
          sleep 20

      - name: Verify production deployment
        run: |
          echo "Verifying production deployment..."
          counter=1
          while [ $counter -le 10 ]; do
            if curl -f http://localhost:3000/health > /dev/null 2>&1; then
              echo "✅ Production application is ready!"
              break
            fi
            echo "Attempt $counter/10 - Production not ready yet..."
            counter=$((counter + 1))
            sleep 3
          done

          if [ $counter -gt 10 ]; then
            echo "❌ Production failed to start"
            exit 1
          fi

          # Comprehensive production checks
          curl -f http://localhost:3000/health
          echo ""
          curl -f http://localhost:3000/
          echo ""

          # Check application process
          if ps -p $(cat app.pid) > /dev/null; then
            echo "✅ Application process is running (PID: $(cat app.pid))"
          else
            echo "❌ Application process failed"
            exit 1
          fi

      - name: Run production smoke tests
        run: |
          echo "Running production smoke tests..."

          # Test critical user journey
          curl -X POST http://localhost:3000/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"username":"productionuser","email":"production@example.com","password":"password123"}' \
            -w "\nHTTP Status: %{http_code}\n" || echo "User creation test completed"

          echo "✅ Production smoke tests passed"

      - name: Log deployment info
        run: |
          echo "🎉 PRODUCTION DEPLOYMENT SUCCESSFUL"
          echo "📍 URL: http://localhost:3000"
          echo "🏥 Health: http://localhost:3000/health"
          echo "📊 Environment: production"
          echo "🔧 Node: $(node --version)"
          echo "🕒 Deployed at: $(date)"
          echo "📝 Commit: ${{ github.sha }}"

      - name: Upload production logs
        uses: actions/upload-artifact@v4
        with:
          name: production-deployment-logs
          path: |
            production.log
            app.pid
          retention-days: 30

# Этап 4: Расширенный мониторинг и метрики
monitoring:
  runs-on: self-hosted
  needs: deploy-production
  name: Extended Monitoring & Health Checks
  if: github.ref == 'refs/heads/main'
  timeout-minutes: 10

  steps:
    - name: Setup monitoring tools
      run: |
        echo "Installing monitoring dependencies..."
        # Установка утилит для мониторинга (если необходимо)
        sudo apt-get update || true
        command -v htop || sudo apt-get install -y htop || echo "htop not available"
        command -v iostat || sudo apt-get install -y sysstat || echo "sysstat not available"

    - name: Extended health checks with retry
      run: |
        echo "Starting comprehensive health monitoring..."
        HEALTHY=false
        for attempt in {1..10}; do
          echo "=== Health check $attempt ==="
          
          # Проверка процесса приложения
          if ps -p $(cat app.pid 2>/dev/null) > /dev/null 2>&1; then
            echo "✅ Application process is running (PID: $(cat app.pid))"
          else
            echo "❌ Application process not found"
            break
          fi

          # Расширенная проверка health endpoint
          response=$(curl -s -w "\n%{http_code}" http://localhost:3000/health || echo "CURL_FAILED")
          status_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n1)
          
          if [ "$status_code" = "200" ]; then
            echo "✅ Health check $attempt: PASSED (Status: $status_code)"
            echo "Response: $body"
            HEALTHY=true
            
            # Дополнительные проверки если health endpoint работает
            echo "=== Additional endpoint checks ==="
            
            # Проверка основного endpoint
            main_response=$(curl -s -w " HTTP %{http_code}" http://localhost:3000/)
            echo "Main endpoint: $main_response"
            
            # Проверка времени ответа
            echo "Response time metrics:"
            for endpoint in "/health" "/"; do
              start_time=$(date +%s%N)
              curl -s -o /dev/null http://localhost:3000$endpoint
              end_time=$(date +%s%N)
              response_time=$(( (end_time - start_time) / 1000000 ))
              echo "  $endpoint: ${response_time}ms"
            done
            break
          else
            echo "❌ Health check $attempt: FAILED (Status: $status_code)"
            echo "Full response: $response"
          fi
          
          if [ $attempt -lt 10 ]; then
            echo "Waiting 30 seconds until next check..."
            sleep 30
          fi
        done

        if [ "$HEALTHY" = "false" ]; then
          echo "❌ All health checks failed - application is unhealthy"
          exit 1
        fi

    - name: System performance metrics
      run: |
        echo "📊 === SYSTEM PERFORMANCE METRICS ==="

        # Память
        echo "Memory Usage:"
        free -h || echo "free command not available"

        # Дисковое пространство
        echo -e "\nDisk Usage:"
        df -h || echo "df command not available"

        # Нагрузка CPU
        echo -e "\nCPU Load:"
        top -bn1 | head -20 || echo "top command not available"

        # I/O статистика
        echo -e "\nI/O Statistics:"
        iostat -x 1 1 2>/dev/null || echo "iostat not available"

        # Сетевые соединения
        echo -e "\nNetwork Connections (app related):"
        netstat -tulpn 2>/dev/null | grep :3000 || ss -tulpn 2>/dev/null | grep :3000 || echo "netstat/ss not available"

    - name: Application performance testing
      run: |
        echo "🚀 === APPLICATION PERFORMANCE TESTING ==="

        # Тест нагрузки на health endpoint
        echo "Load testing health endpoint (10 requests):"
        for i in {1..10}; do
          start=$(date +%s%N)
          curl -s -o /dev/null http://localhost:3000/health
          end=$(date +%s%N)
          echo "  Request $i: $(( (end - start) / 1000000 ))ms"
        done

        # Проверка параллельных запросов
        echo -e "\nConcurrent requests test:"
        time (for i in {1..5}; do
          curl -s http://localhost:3000/health > /dev/null &
        done; wait)

        # Проверка стабильности в течение времени
        echo -e "\nStability test (30 seconds):"
        timeout 30s bash -c '
          while true; do
            curl -s -o /dev/null http://localhost:3000/health
            sleep 1
          done
        ' || echo "Stability test completed"

    - name: Error rate monitoring
      run: |
        echo "📈 === ERROR RATE MONITORING ==="

        # Проверка логов на ошибки
        if [ -f "production.log" ]; then
          echo "Recent errors in logs:"
          grep -i "error\|fail\|exception" production.log | tail -10 || echo "No errors found in logs"
          
          # Подсчет ошибок
          error_count=$(grep -i "error\|fail\|exception" production.log | wc -l || echo "0")
          echo "Total errors in log: $error_count"
        else
          echo "Log file not available for error analysis"
        fi

        # Проверка HTTP ошибок
        echo -e "\nHTTP Error testing:"

        # Тест несуществующего endpoint
        curl -s -w "Unknown endpoint: HTTP %{http_code}\n" http://localhost:3000/nonexistent

        # Тест некорректного метода
        curl -s -X POST -w "POST to health: HTTP %{http_code}\n" http://localhost:3000/health

    - name: Database and resource monitoring
      run: |
        echo "💾 === DATABASE & RESOURCE MONITORING ==="

        # Проверка использования базы данных
        if [ -f "production.sqlite" ]; then
          db_size=$(du -h production.sqlite | cut -f1)
          echo "Database size: $db_size"
        else
          echo "Database file not found"
        fi

        # Проверка использования памяти процессом
        if [ -f "app.pid" ]; then
          pid=$(cat app.pid)
          if ps -p $pid > /dev/null; then
            echo "Process memory usage:"
            ps -o pid,ppid,cmd,%mem,%cpu --pid $pid || echo "Cannot get process details"
          fi
        fi

    - name: Generate monitoring report
      run: |
        echo "📋 === MONITORING SUMMARY REPORT ==="
        echo "Deployment Time: $(date)"
        echo "Commit: ${{ github.sha }}"
        echo "Environment: Production"
        echo "Application URL: http://localhost:3000"
        echo "Health Check: http://localhost:3000/health"

        # Финальная проверка статуса
        if curl -f http://localhost:3000/health > /dev/null 2>&1; then
          echo "🎉 FINAL STATUS: HEALTHY"
          echo "All systems operational"
        else
          echo "⚠️  FINAL STATUS: UNHEALTHY"
          echo "Application failed final health check"
          exit 1
        fi

    - name: Upload monitoring results
      uses: actions/upload-artifact@v4
      with:
        name: monitoring-results
        path: |
          production.log
          app.pid
        retention-days: 30

  # Этап 5: Откат
  rollback:
    runs-on: self-hosted
    name: Rollback Deployment
    environment: production
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Stop current production
        run: |
          echo "Stopping current production deployment..."
          pkill -f "node.*server.js" || true
          sleep 5
          echo "✅ Current production stopped"

      - name: Checkout previous stable version
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.rollback_commit || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install dependencies
        run: npm ci

      - name: Deploy previous version
        run: |
          export PORT=3000
          export NODE_ENV=production
          export DB_STORAGE=./production.sqlite
          nohup npm start > rollback.log 2>&1 &
          echo $! > rollback.pid
          echo "🔄 Rollback deployment started"
          sleep 20

      - name: Verify rollback
        run: |
          echo "Verifying rollback..."
          counter=1
          while [ $counter -le 10 ]; do
            if curl -f http://localhost:3000/health > /dev/null 2>&1; then
              echo "✅ Rollback successful!"
              break
            fi
            echo "Attempt $counter/10 - Rollback not ready yet..."
            counter=$((counter + 1))
            sleep 3
          done

          if [ $counter -gt 10 ]; then
            echo "❌ Rollback failed"
            exit 1
          fi

          curl -f http://localhost:3000/health
          echo "Rollback to commit: ${{ github.event.inputs.rollback_commit || 'main' }}"

      - name: Log rollback info
        run: |
          echo "🔄 ROLLBACK COMPLETED"
          echo "📍 Rollback to: ${{ github.event.inputs.rollback_commit || 'main' }}"
          echo "🕒 Rollback time: $(date)"
          echo "📝 Current commit: $(git rev-parse HEAD)"
