name: Deploy to Self-Hosted Runner

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install dependencies
        run: npm install

      - name: Run tests with SQLite
        run: |
          export DB_DIALECT=sqlite
          export DB_STORAGE=./test.sqlite
          npm test

  deploy:
    needs: test
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install dependencies
        run: npm install

      - name: Start application with SQLite
        run: |
          export DB_DIALECT=sqlite
          export DB_STORAGE=./database.sqlite
          npm start &
          echo "Application starting in background..."
          sleep 15

      - name: Test application (macOS compatible)
        run: |
          # macOS-совместимая версия ожидания
          echo "Waiting for application to start..."
          for i in {1..15}; do
            if curl -f http://localhost:8080/health > /dev/null 2>&1; then
              echo "✅ Application is ready!"
              break
            fi
            echo "Attempt $i/15 - Application not ready yet..."
            sleep 2
          done

          # Финальная проверка
          if curl -f http://localhost:8080/health; then
            echo "✅ Health check passed"
          else
            echo "❌ Application failed to start"
            exit 1
          fi

          # Тестируем основные endpoints
          curl http://localhost:8080/health
          echo ""
          curl http://localhost:8080/
          echo ""

      - name: Keep running
        run: |
          echo "🚀 Application successfully deployed on macOS Self-Hosted Runner"
          echo "📍 Health check: http://localhost:8080/health"
          echo "📍 API documentation: http://localhost:8080/"
          echo "⏰ Application will run for 5 minutes..."
          sleep 300
