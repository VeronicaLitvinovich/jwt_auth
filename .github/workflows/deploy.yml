name: Full CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_ENV: test
  DB_DIALECT: sqlite

jobs:
  build-and-unit-tests:
    runs-on: self-hosted
    name: Build and Unit Tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --production --audit-level=high

      - name: Run unit tests with coverage
        run: |
          npm run test:unit
        env:
          NODE_ENV: test

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage/
          retention-days: 7

  # Этап 2: Деплой на staging и интеграционные тесты
  deploy-staging-and-integration-tests:
    runs-on: self-hosted
    needs: build-and-unit-tests
    environment: staging
    name: Deploy to Staging & Integration Tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install dependencies
        run: npm ci

      - name: Download unit test coverage
        uses: actions/download-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage/

      - name: Deploy to staging environment
        run: |
          export PORT=3001
          export NODE_ENV=staging
          export DB_STORAGE=./staging.sqlite
          npm start &
          echo "🚀 Staging deployment started on port 3001"
          sleep 15

      - name: Wait for staging to be ready (macOS compatible)
        run: |
          echo "Waiting for staging application..."
          counter=1
          while [ $counter -le 10 ]; do
            if curl -f http://localhost:3001/health > /dev/null 2>&1; then
              echo "✅ Staging application is ready!"
              break
            fi
            echo "Attempt $counter/10 - Staging not ready yet..."
            counter=$((counter + 1))
            sleep 3
          done

          if [ $counter -gt 10 ]; then
            echo "❌ Staging failed to start"
            exit 1
          fi

      - name: Run integration tests against staging
        run: |
          export TEST_BASE_URL=http://localhost:3001
          npm run test:integration
        env:
          NODE_ENV: test

      - name: API smoke tests
        run: |
          echo "Running API smoke tests on staging..."

          # Health check
          curl -f http://localhost:3001/health
          echo "✅ Health check passed"

          # Main endpoint
          curl -f http://localhost:3001/
          echo "✅ Main endpoint passed"

          # Test authentication endpoints
          curl -X POST http://localhost:3001/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"username":"staginguser","email":"staging@example.com","password":"password123"}' \
            -w "\nHTTP Status: %{http_code}\n" || echo "User creation test completed"

          echo "✅ Staging environment verified"

      - name: Upload staging test results
        uses: actions/upload-artifact@v4
        with:
          name: staging-test-results
          path: |
            test-results/
            coverage/
          retention-days: 7

  # Этап 3: Деплой в production
  deploy-production:
    runs-on: self-hosted
    needs: deploy-staging-and-integration-tests
    environment: production
    name: Deploy to Production
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install dependencies
        run: npm ci

      - name: Stop previous production instance
        run: |
          # Останавливаем предыдущую версию приложения
          pkill -f "node.*server.js" || true
          sleep 3
          echo "✅ Previous instance stopped"

      - name: Deploy to production
        run: |
          export PORT=3000
          export NODE_ENV=production
          export DB_STORAGE=./production.sqlite
          nohup npm start > production.log 2>&1 &
          echo $! > app.pid
          echo "🚀 Production deployment started on port 3000"
          sleep 20

      - name: Verify production deployment
        run: |
          echo "Verifying production deployment..."
          counter=1
          while [ $counter -le 10 ]; do
            if curl -f http://localhost:3000/health > /dev/null 2>&1; then
              echo "✅ Production application is ready!"
              break
            fi
            echo "Attempt $counter/10 - Production not ready yet..."
            counter=$((counter + 1))
            sleep 3
          done

          if [ $counter -gt 10 ]; then
            echo "❌ Production failed to start"
            exit 1
          fi

          # Comprehensive production checks
          curl -f http://localhost:3000/health
          echo ""
          curl -f http://localhost:3000/
          echo ""

          # Check application process
          if ps -p $(cat app.pid) > /dev/null; then
            echo "✅ Application process is running (PID: $(cat app.pid))"
          else
            echo "❌ Application process failed"
            exit 1
          fi

      - name: Run production smoke tests
        run: |
          echo "Running production smoke tests..."

          # Test critical user journey
          curl -X POST http://localhost:3000/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"username":"productionuser","email":"production@example.com","password":"password123"}' \
            -w "\nHTTP Status: %{http_code}\n" || echo "User creation test completed"

          echo "✅ Production smoke tests passed"

      - name: Log deployment info
        run: |
          echo "🎉 PRODUCTION DEPLOYMENT SUCCESSFUL"
          echo "📍 URL: http://localhost:3000"
          echo "🏥 Health: http://localhost:3000/health"
          echo "📊 Environment: production"
          echo "🔧 Node: $(node --version)"
          echo "🕒 Deployed at: $(date)"
          echo "📝 Commit: ${{ github.sha }}"

      - name: Upload production logs
        uses: actions/upload-artifact@v4
        with:
          name: production-deployment-logs
          path: |
            production.log
            app.pid
          retention-days: 30

  # Этап 4: Комплексный мониторинг ключевых показателей
  monitoring:
    runs-on: self-hosted
    needs: deploy-production
    name: Production Monitoring & Metrics
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Application health monitoring
        run: |
          echo "🏥 APPLICATION HEALTH MONITORING"
          echo "================================="

          # Проверка доступности приложения
          echo "Checking application availability..."
          for i in {1..3}; do
            response=$(curl -s -w "\n%{http_code}" http://localhost:3000/health 2>/dev/null || echo "CURL_ERROR")
            status_code=$(echo "$response" | tail -n1)
            response_body=$(echo "$response" | head -n1)
            
            if [ "$status_code" = "200" ]; then
              echo "✅ Health check $i: SUCCESS (Status: $status_code)"
              echo "Response: $response_body"
              break
            else
              echo "❌ Health check $i: FAILED (Status: $status_code)"
              if [ $i -eq 3 ]; then
                echo "💥 Application health check failed after 3 attempts"
                exit 1
              fi
              sleep 10
            fi
          done

      - name: Error rate monitoring
        run: |
          echo " "
          echo "📊 ERROR RATE MONITORING"
          echo "========================"

          # Проверка ошибок в логах
          if [ -f "production.log" ]; then
            echo "Analyzing application logs..."
            
            # Подсчет ошибок по типам
            error_count=$(grep -c -i "error" production.log 2>/dev/null || echo "0")
            fatal_count=$(grep -c -i "fatal" production.log 2>/dev/null || echo "0")
            exception_count=$(grep -c -i "exception" production.log 2>/dev/null || echo "0")
            warn_count=$(grep -c -i "warn" production.log 2>/dev/null || echo "0")
            
            echo "📈 Error Statistics:"
            echo "  Errors: $error_count"
            echo "  Fatal: $fatal_count"
            echo "  Exceptions: $exception_count"
            echo "  Warnings: $warn_count"
            
            # Показываем последние ошибки (если есть)
            if [ "$error_count" -gt 0 ]; then
              echo " "
              echo "⚠️ Recent Errors:"
              grep -i "error" production.log | tail -5 || echo "No recent errors"
            fi
          else
            echo "ℹ️ Log file not available for error analysis"
          fi

          # Проверка HTTP ошибок
          echo " "
          echo "🌐 HTTP Endpoint Status:"
          endpoints=("/" "/health" "/api/auth/signup")
          for endpoint in "${endpoints[@]}"; do
            status_code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000$endpoint" 2>/dev/null || echo "000")
            if [ "$status_code" = "200" ] || [ "$status_code" = "201" ] || [ "$status_code" = "400" ]; then
              echo "  ✅ $endpoint: HTTP $status_code"
            else
              echo "  ❌ $endpoint: HTTP $status_code"
            fi
          done

      - name: Server load monitoring
        run: |
          echo " "
          echo "⚡ SERVER LOAD MONITORING"
          echo "========================"

          # Используем встроенные команды macOS/Linux
          echo "💻 CPU & Load:"
          echo "  Load average: $(uptime | awk -F'load averages:' '{print $2}' | cut -d',' -f1 | xargs)"

          echo "💾 Memory Usage:"
          # Для macOS
          if [ "$(uname)" = "Darwin" ]; then
            memory_total=$(sysctl -n hw.memsize | awk '{printf "%.1f", $1/1024/1024/1024}')
            memory_pressure=$(memory_pressure | grep "System-wide memory free percentage:" | awk '{print $5}')
            echo "  Total RAM: ${memory_total}GB"
            echo "  Free memory: ${memory_pressure}%"
          else
            # Для Linux
            memory_info=$(free -h | grep Mem | awk '{print "Total: " $2 ", Used: " $3 ", Free: " $4}')
            echo "  $memory_info"
          fi

          echo "📁 Disk Usage:"
          disk_info=$(df -h . | awk 'NR==2 {print "Available: " $4 ", Used: " $5}')
          echo "  $disk_info"

          echo "🔍 Process Count:"
          node_processes=$(ps aux | grep -c "[n]ode" || echo "0")
          echo "  Node.js processes: $node_processes"

      - name: Performance metrics
        run: |
          echo " "
          echo "🚀 PERFORMANCE METRICS"
          echo "======================"

          # Измерение времени ответа
          echo "⏱️ Response Time Analysis:"

          endpoints=("/health" "/")
          for endpoint in "${endpoints[@]}"; do
            total_time=0
            successful_requests=0
            
            for i in {1..5}; do
              start_time=$(date +%s%N)
              http_code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000$endpoint" 2>/dev/null || echo "000")
              end_time=$(date +%s%N)
              
              if [ "$http_code" = "200" ]; then
                response_time=$(( (end_time - start_time) / 1000000 ))
                total_time=$((total_time + response_time))
                successful_requests=$((successful_requests + 1))
                echo "  $endpoint request $i: ${response_time}ms (HTTP $http_code)"
              else
                echo "  $endpoint request $i: FAILED (HTTP $http_code)"
              fi
            done
            
            if [ $successful_requests -gt 0 ]; then
              avg_time=$((total_time / successful_requests))
              echo "  📊 $endpoint average: ${avg_time}ms (success rate: $successful_requests/5)"
            else
              echo "  💥 $endpoint: All requests failed"
            fi
          done

      - name: Load testing
        run: |
          echo " "
          echo "🔄 LOAD TESTING"
          echo "==============="

          # Простой тест на 10 одновременных запросов
          echo "Testing with 10 concurrent requests..."
          start_time=$(date +%s)

          for i in {1..10}; do
            curl -s "http://localhost:3000/health" > "/dev/null" &
          done

          # Ждем завершения всех фоновых процессов
          wait
          end_time=$(date +%s)

          echo "✅ 10 concurrent requests completed in $((end_time - start_time)) seconds"

      - name: Database and resource check
        run: |
          echo " "
          echo "💾 DATABASE & RESOURCES"
          echo "======================="

          # Проверка файла базы данных
          if [ -f "production.sqlite" ]; then
            db_size=$(du -h production.sqlite | cut -f1)
            echo "✅ Database file exists"
            echo "  Database size: $db_size"
          else
            echo "❌ Database file not found"
          fi

          # Проверка открытых портов
          echo "🌐 Network Ports:"
          if command -v lsof > /dev/null; then
            port_3000=$(lsof -i :3000 | grep -c LISTEN || echo "0")
            echo "  Port 3000 (App): $( [ "$port_3000" -gt 0 ] && echo "LISTENING" || echo "CLOSED" )"
          else
            echo "  Port check: lsof not available"
          fi

      - name: Generate comprehensive report
        run: |
          echo " "
          echo "📋 COMPREHENSIVE MONITORING REPORT"
          echo "=================================="
          echo "🕒 Monitoring completed: $(date)"
          echo "📍 Application URL: http://localhost:3000"
          echo "🏥 Health endpoint: http://localhost:3000/health"
          echo "🔧 Environment: Production"
          echo "💻 System: $(uname -s) $(uname -m)"
          echo " "

          # Финальная проверка статуса
          if curl -s http://localhost:3000/health > /dev/null; then
            echo "🎉 FINAL STATUS: HEALTHY"
            echo "✅ All systems operational"
            echo "✅ Error rates within acceptable limits"
            echo "✅ Server load normal"
            echo "✅ Performance metrics good"
          else
            echo "❌ FINAL STATUS: UNHEALTHY"
            echo "💥 Application is not responding"
            exit 1
          fi

  # Этап 5: Откат
  rollback:
    runs-on: self-hosted
    name: Rollback Deployment
    environment: production
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Stop current production
        run: |
          echo "Stopping current production deployment..."
          pkill -f "node.*server.js" || true
          sleep 5
          echo "✅ Current production stopped"

      - name: Checkout previous stable version
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.rollback_commit || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install dependencies
        run: npm ci

      - name: Deploy previous version
        run: |
          export PORT=3000
          export NODE_ENV=production
          export DB_STORAGE=./production.sqlite
          nohup npm start > rollback.log 2>&1 &
          echo $! > rollback.pid
          echo "🔄 Rollback deployment started"
          sleep 20

      - name: Verify rollback
        run: |
          echo "Verifying rollback..."
          counter=1
          while [ $counter -le 10 ]; do
            if curl -f http://localhost:3000/health > /dev/null 2>&1; then
              echo "✅ Rollback successful!"
              break
            fi
            echo "Attempt $counter/10 - Rollback not ready yet..."
            counter=$((counter + 1))
            sleep 3
          done

          if [ $counter -gt 10 ]; then
            echo "❌ Rollback failed"
            exit 1
          fi

          curl -f http://localhost:3000/health
          echo "Rollback to commit: ${{ github.event.inputs.rollback_commit || 'main' }}"

      - name: Log rollback info
        run: |
          echo "🔄 ROLLBACK COMPLETED"
          echo "📍 Rollback to: ${{ github.event.inputs.rollback_commit || 'main' }}"
          echo "🕒 Rollback time: $(date)"
          echo "📝 Current commit: $(git rev-parse HEAD)"
